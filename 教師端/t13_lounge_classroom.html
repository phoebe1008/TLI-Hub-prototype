<!--
  TLI 中心教師「進入教室」（Mandarin Lounge 團體場次）
  畫面內容與學員的 m16_classroom.html 相同，但獨立成教師端頁面：
   - 左側選單為教師端選單（不導到學員頁）
   - 沒有學員用的「回課表」「有問題？聯繫顧問」
   - 新增「回場次列表」（回 t11_lounge_sessions.html，保留 view 參數）
  網址：t13_lounge_classroom.html?tsid=場次id[&view=1a][&state=before|open|ended]
-->
<style>
:root{
  --c-primary:#1B4E8C;--c-primary-dark:#123A68;--c-accent:#E8792B;--c-accent-dark:#CF691F;--c-secondary:#0F9B79;
  --c-bg:#F5F7FA;--c-border:#E4E7EC;--c-muted:#667085;--c-text:#101828;
  --radius:12px;--radius-sm:8px;--shadow:0 1px 3px rgba(16,24,40,.08),0 1px 2px rgba(16,24,40,.04);--shadow-lg:0 8px 24px rgba(16,24,40,.16);
  --topbar-h:52px;--bottomnav-h:64px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;overflow-x:hidden;}
body{font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--c-bg);color:var(--c-text);line-height:1.55;font-size:15px;-webkit-tap-highlight-color:transparent;}
a{color:inherit;text-decoration:none;}
img,svg{display:block;}
button{font-family:inherit;}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--c-primary);outline-offset:2px;}
.app{min-height:100vh;position:relative;}
.topbar{position:sticky;top:0;z-index:60;height:var(--topbar-h);background:#fff;border-bottom:1px solid var(--c-border);display:flex;align-items:center;justify-content:space-between;padding:0 14px;gap:10px;}
.topbar-left{display:flex;align-items:center;gap:8px;min-width:0;}
.topbar-logo-wrap{width:26px;height:22px;overflow:hidden;position:relative;flex:none;}
.topbar-logo-wrap img{position:absolute;left:0;top:0;height:22px;width:auto;max-width:none;}
.topbar-title{font-size:16.5px;font-weight:700;color:var(--c-text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.topbar-actions{display:flex;align-items:center;gap:6px;position:relative;}
.side-nav{display:none;}
@media(min-width:1024px){
  .side-nav{display:flex;flex-direction:column;position:fixed;left:0;top:0;bottom:0;width:310px;background:#fff;border-right:1px solid var(--c-border);padding:18px 12px;z-index:50;overflow-y:auto;}
  .side-brand{display:flex;align-items:center;padding:0 8px 18px;}
  .side-brand img{height:28px;width:auto;}
  .side-identity{padding:0 8px 14px;margin-bottom:6px;font-size:12.5px;font-weight:700;color:var(--c-text);border-bottom:1px solid var(--c-border);}
  .side-link{display:flex;align-items:center;gap:10px;padding:10px 10px;border-radius:8px;font-size:14px;font-weight:600;color:var(--c-muted);margin-bottom:2px;}
  .side-link svg{width:19px;height:19px;flex:none;}
  .side-link.active{background:#E6EEF8;color:var(--c-primary);}
  .side-link:hover:not(.active){background:var(--c-bg);}
  .app.has-side .topbar{margin-left:310px;}
  .app.has-side .content{margin-left:310px;}
}
.bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:70;background:#fff;border-top:1px solid var(--c-border);display:flex;height:var(--bottomnav-h);padding-bottom:env(safe-area-inset-bottom,0);box-shadow:0 -2px 10px rgba(16,24,40,.06);}
.bottom-nav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;color:var(--c-muted);font-weight:600;min-height:44px;}
.bottom-nav a svg{width:20px;height:20px;}
.bottom-nav a.active{color:var(--c-primary);}
@media(min-width:1024px){.bottom-nav{display:none;}}
.content{max-width:640px;margin:0 auto;padding:18px 16px calc(var(--bottomnav-h) + 24px);}
@media(min-width:1024px){.content{padding:26px 32px 40px;}}
.page-h{font-size:19px;font-weight:700;margin:2px 0 4px;line-height:1.4;}
.page-sub{color:var(--c-muted);font-size:13px;margin:0 0 18px;}
.section-title{font-size:15px;font-weight:700;margin:22px 0 12px;}
.section-title.first{margin-top:4px;}
.card{background:#fff;border:1px solid var(--c-border);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;}
.card + .card{margin-top:12px;}
.muted{color:var(--c-muted);}
.small{font-size:12px;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:var(--radius-sm);padding:11px 18px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:background .15s;min-height:44px;}
.btn-primary{background:var(--c-primary);color:#fff;}
.btn-primary:hover{background:var(--c-primary-dark);}
.btn-accent{background:var(--c-accent);color:#fff;}
.btn-accent:hover{background:var(--c-accent-dark);}
.btn-outline{background:#fff;border:1px solid var(--c-border);color:var(--c-text);}
.btn-outline:hover{background:var(--c-bg);}
.btn-block{width:100%;}
.badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:700;white-space:nowrap;}
.badge-info{background:#E6EEF8;color:var(--c-primary);}
.badge-ok{background:#E4F5F0;color:#0B6B52;}
.badge-muted{background:var(--c-border);color:var(--c-muted);}
.badge-payer-self{background:#E6EEF8;color:var(--c-primary);}
.badge-payer-company{background:#FCEBDC;color:var(--c-accent-dark);}
.badge-payer-project{background:#E4F5F0;color:#0B6B52;}
.badge-payer-school{background:#F3E8FD;color:#6B21A8;}
.badge-type-1on1{background:#E6EEF8;color:var(--c-primary);}
.badge-type-group{background:#E4F5F0;color:#0B6B52;}
.badge-type-chat{background:#F3E8FD;color:#6B21A8;}
.badge-type-event{background:#FCEBDC;color:var(--c-accent-dark);}
.hidden{display:none!important;}
.stack{display:flex;flex-direction:column;gap:8px;}
.badge-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px;}
.toast{position:fixed;left:50%;bottom:calc(var(--bottomnav-h) + 18px);transform:translateX(-50%);background:#101828;color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;font-weight:700;z-index:120;box-shadow:var(--shadow-lg);white-space:nowrap;max-width:88vw;overflow:hidden;text-overflow:ellipsis;}
.toast.hidden{display:none;}
@media(min-width:1024px){.toast{bottom:24px;}}
/* ---------- 示範狀態切換 ---------- */
/* ---------- 課程資訊卡 ---------- */
.class-time-line{font-size:13px;color:var(--c-muted);line-height:1.7;margin-bottom:8px;}
.class-teacher-line{font-size:13.5px;line-height:1.6;margin-bottom:10px;}
.class-plan-line{font-size:12px;color:var(--c-muted);margin-top:2px;}
/* ---------- 狀態列 ---------- */
.countdown-num{font-size:24px;font-weight:700;margin:6px 0 4px;color:var(--c-text);}
/* ---------- 課前準備：教材／裝置檢查／提醒 ---------- */
.prep-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--c-border);}
.prep-row>div:first-child{min-width:0;flex:1 1 0%;}
.prep-row .small{white-space:normal;word-break:break-word;overflow-wrap:anywhere;}
.prep-row:first-child{border-top:none;padding-top:0;}
.dev-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--c-border);}
.dev-row:first-child{border-top:none;padding-top:0;}
.dev-icon{width:38px;height:38px;border-radius:9px;background:var(--c-bg);display:flex;align-items:center;justify-content:center;color:var(--c-muted);flex:none;}
.dev-icon.ok{background:#E4F5F0;color:#0B6B52;}
.dev-icon svg{width:18px;height:18px;}
.dev-body{flex:1;min-width:0;}
.dev-body h4{margin:0;font-size:13.5px;font-weight:700;}
.dev-body p{margin:2px 0 0;font-size:12px;color:var(--c-muted);}
.dev-check{width:18px;height:18px;color:#0B6B52;flex:none;}
.reminder-list{margin:0;padding-left:18px;font-size:13px;line-height:1.9;color:var(--c-text);}
.reminder-list li{margin-bottom:2px;}
/* ---------- Zoom 進入示意視窗（沿用全站 sheet 樣式） ---------- */
.sheet-overlay{position:fixed;inset:0;background:rgba(16,24,40,.45);z-index:100;display:flex;align-items:flex-end;justify-content:center;}
.sheet-overlay.hidden{display:none;}
.sheet{background:#fff;width:100%;max-width:420px;border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0));max-height:86vh;overflow-y:auto;}
.sheet-handle{width:36px;height:4px;background:var(--c-border);border-radius:4px;margin:0 auto 14px;}
@media(min-width:640px){.sheet-overlay{align-items:center;}.sheet{border-radius:16px;}}
.meeting-field{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 12px;background:var(--c-bg);border-radius:8px;font-size:13px;margin-top:8px;}
.meeting-field span{color:var(--c-muted);white-space:nowrap;}
.side-role{padding:0 10px 14px;margin-bottom:10px;border-bottom:1px solid var(--c-border);}
.side-role strong{display:block;font-size:14px;color:var(--c-primary);font-weight:700;}
.side-role span{display:block;font-size:12px;color:var(--c-muted);margin-top:2px;}
.btn-sm{min-height:36px;padding:7px 12px;font-size:12.5px;}
.back-row{margin:0 0 14px;}
.bell-btn{position:relative;width:32px;height:32px;border-radius:50%;border:1px solid var(--c-border);background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--c-muted);}
.bell-btn svg{width:17px;height:17px;}
.bell-btn .dot{position:absolute;top:4px;right:5px;width:8px;height:8px;border-radius:50%;background:var(--c-accent);}
.bell-panel{display:none;position:absolute;right:0;top:40px;width:280px;background:#fff;border:1px solid var(--c-border);border-radius:var(--radius);box-shadow:var(--shadow-lg);padding:12px;z-index:80;}
.bell-panel.open{display:block;}
.bell-panel h4{margin:0 0 8px;font-size:13.5px;}
.bell-item{display:flex;gap:8px;font-size:12.5px;}
.bell-item p{margin:0 0 2px;}
.bell-item span{color:var(--c-muted);font-size:11.5px;}
.b-dot{width:7px;height:7px;border-radius:50%;background:var(--c-accent);margin-top:6px;flex:none;}
.view-1a .side-nav .side-link:not(.keep),.view-1a .bottom-nav a:not(.keep){display:none!important;}
.view-1a .side-nav .side-link.keep{display:flex!important;}
.view-1a .bottom-nav a.keep{display:flex!important;}

</style>
</head>

  <div class="sheet">

      <button type="button" class="btn btn-outline btn-block" data-i18n="m16.zoom.clickIfNotOpened" onclick="showToast(T('不會另外開啟外部視窗',{en:'No separate external window will open',ja:'外部ウィンドウは別途開きません',de:'Es öffnet sich kein separates externes Fenster'}))">若未自動開啟請點此</button>

    </div>
  </div>

<div class="toast hidden" id="toast"></div>

<script>window.TLI_I18N_PAGE_LANGS=['zh-TW','zh-CN','en'];</script>
<script src="../assets/_i18n_dict.js"></script>
<script src="../assets/_i18n_dict_member.js"></script>
<script src="../assets/_i18n_dict_teacher.js"></script>
<script src="../assets/_shared_masters.js"></script>
<script src="../會員區/_project_learning.js"></script>
<script src="../assets/_i18n.js"></script>
<script>
function T(zh,obj){ return TLI_I18N.t(zh,obj); }
function qs(name){ var m = new RegExp('[?&]'+name+'=([^&]*)').exec(location.search); return m ? decodeURIComponent(m[1]) : null; }
function showToast(msg){ var t=document.getElementById('toast'); if(!t)return; t.textContent=msg; t.classList.remove('hidden'); clearTimeout(window._toastTimer); window._toastTimer=setTimeout(function(){t.classList.add('hidden');},2200); }
function toggleBell(){ document.getElementById('bellPanel').classList.toggle('open'); }
document.addEventListener('click',function(e){ if(!e.target.closest('.bell-btn')&&!e.target.closest('.bell-panel')) document.getElementById('bellPanel').classList.remove('open'); });

/* ---------- 回場次列表（保留 view=1a 之類的檢視參數） ---------- */
var VIEW = qs('view');
var LIST_URL = 't11_lounge_sessions.html' + (VIEW ? '?view='+encodeURIComponent(VIEW) : '');
function backToList(){ location.href = LIST_URL; }
['navLounge','navLounge2'].forEach(function(id){ var a=document.getElementById(id); if(a) a.setAttribute('href', LIST_URL); });
if (VIEW==='1a'){ document.body.classList.add('view-1a'); }

/* ---------- 場次資料：由教師端場次（TLI_PL.teacherSessions）取得 ---------- */
var TSID = qs('tsid');
var SES = TSID ? TLI_PL.teacherSessions().filter(function(x){ return x.id===TSID; })[0] : null;
if (!SES){
  document.querySelector('.content').innerHTML = '<div class="back-row"><button type="button" class="btn btn-outline btn-sm" onclick="backToList()">'+T('‹ 回場次列表',{en:'‹ Back to session list'})+'</button></div><div class="card"><div class="page-h">'+T('找不到這個場次',{en:'Session not found'})+'</div><p class="small muted">'+T('請回場次列表重新選擇。',{en:'Go back to the session list and choose again.'})+'</p></div>';
} else {
  var mins = Math.max(0, Math.round((SES.utc - TLI_PL.nowUtc)/60000));
  var endT = (function(t){ var p=t.split(':'); var m=(+p[0])*60+(+p[1])+30; return ('0'+Math.floor(m/60)%24).slice(-2)+':'+('0'+m%60).slice(-2); })(SES.tpTime);
  var STATE_PARAM = qs('state');
  var STATE = (STATE_PARAM==='before'||STATE_PARAM==='open'||STATE_PARAM==='ended') ? STATE_PARAM : 'before';
  function audTxt(){ return SES.audience==='project' ? T('專案合作',{en:'Partner program'}) : T('直營',{en:'Direct'}); }

  function renderHeader(){
    var tb = document.getElementById('typeBadge'); tb.textContent = 'Mandarin Lounge'; tb.className = 'badge badge-type-chat';
    var pb = document.getElementById('planBadge'); pb.textContent = audTxt(); pb.className = 'badge badge-payer-' + (SES.audience==='project' ? 'project' : 'self');
    document.getElementById('lessonTitle').textContent = 'Mandarin Lounge'+T('（團體）：',{en:' (group): '}) + SES.topic;
    document.getElementById('planNameLine').textContent = T('已報名 ',{en:'Enrolled '}) + SES.taken + '／' + SES.cap;
    document.getElementById('timeLine').innerHTML = T('台北',{en:'Taipei'})+' '+SES.tpDate.slice(5).replace('-','/')+' '+SES.tpTime+'–'+endT;
    document.getElementById('teacherLine').innerHTML = '<b>'+T('帶領老師：',{en:'Instructor: '})+'</b>'+SES.teacher+T('老師（TLI）',{en:' (TLI)'})+'．'+T('TLI 中心教師，帶領 30 分鐘口說練習。',{en:'TLI center teacher leading a 30-minute speaking session.'});
    document.getElementById('materialLink').textContent = T('教材：',{en:'Material: '}) + T('Mandarin Lounge 討論題綱（PDF）',{en:'Mandarin Lounge discussion outline (PDF)'});
  }
  function renderStatus(){
    var el = document.getElementById('statusCard'), html = '';
    if (STATE==='before'){
      html += '<div class="small muted">'+T('尚未開放進入',{en:'Not open yet'})+'</div>';
      html += '<div class="countdown-num">'+T('距開課',{en:'Starts in'})+' '+mins+' '+T('分',{en:'min'})+'</div>';
      html += '<div class="small muted">'+T('開課前 15 分鐘開放進入教室',{en:'Opens 15 minutes before class'})+'</div>';
    } else if (STATE==='open'){
      html += '<div class="badge badge-ok" style="margin-bottom:12px;">'+T('可進入',{en:'Ready to join'})+'</div>';
      html += '<button type="button" class="btn btn-primary btn-block" onclick="openZoomModal()">'+(SES.tool==='zoom'?T('開啟 Zoom 教室',{en:'Open Zoom Classroom'}):T('開啟 Teams 教室',{en:'Open Teams Classroom'}))+'</button>';
    } else {
      html += '<div style="font-weight:700;">'+T('本堂已結束',{en:'This class has ended'})+'</div>';
    }
    el.innerHTML = html;
  }
  function renderReminders(){
    var lines = [
      T('請準時於開課時間登入，避免錯過課程內容。',{en:'Please log in on time to avoid missing course content.'}),
      T('上課全程請開啟攝影機與麥克風，以利口說練習與互動。',{en:'Keep your camera and microphone on throughout the class for speaking practice and interaction.'}),
      T('Mandarin Lounge 每場 30 分鐘，開始前 2 小時以上可在預約頁取消，名額會釋出給其他同學。',{en:'Each Mandarin Lounge session runs 30 minutes. You can cancel on the booking page up to 2 hours before the start so the seat opens for others.'})
    ];
    document.getElementById('reminderList').innerHTML = lines.map(function(t){ return '<li>'+t+'</li>'; }).join('');
  }
  var DEVICE_STATE='idle', deviceChecking=false;
  function deviceStatusText(){ return DEVICE_STATE==='checking' ? T('檢查中…',{en:'Checking…'}) : (DEVICE_STATE==='done' ? T('正常',{en:'OK'}) : T('尚未檢查',{en:'Not checked yet'})); }
  function deviceBtnText(){ return DEVICE_STATE==='checking' ? T('檢查中…',{en:'Checking…'}) : (DEVICE_STATE==='done' ? T('重新檢查',{en:'Check Again'}) : T('開始檢查',{en:'Start Check'})); }
  function renderDeviceStatus(){ ['Mic','Cam','Net'].forEach(function(k){ document.getElementById('status'+k).textContent = deviceStatusText(); }); document.getElementById('deviceCheckBtn').textContent = deviceBtnText(); }
  function runDeviceCheck(){
    if (deviceChecking) return; deviceChecking = true; DEVICE_STATE='checking';
    ['Mic','Cam','Net'].forEach(function(k){ document.getElementById('icon'+k).classList.remove('ok'); document.getElementById('check'+k).classList.add('hidden'); });
    renderDeviceStatus();
    setTimeout(function(){ DEVICE_STATE='done'; ['Mic','Cam','Net'].forEach(function(k){ document.getElementById('icon'+k).classList.add('ok'); document.getElementById('check'+k).classList.remove('hidden'); }); renderDeviceStatus(); deviceChecking=false; }, 1000);
  }
  /* 進入教室：站內示意視窗，不連外網（會議連結由系統代管） */
  function openZoomModal(){
    var isZoom = SES.tool==='zoom';
    document.querySelector('#zoomOverlay h3').textContent = isZoom ? T('開啟 Zoom 教室',{en:'Open Zoom classroom'}) : T('開啟 Teams 教室',{en:'Open Teams classroom'});
    document.getElementById('zoomStatusText').textContent = T('正在以主持人身分進入會議…',{en:'Joining the meeting as host…'});
    document.getElementById('zoomOverlay').classList.remove('hidden');
  }
  function closeZoomModal(){ document.getElementById('zoomOverlay').classList.add('hidden'); }
  function handleZoomOverlayClick(e){ if (e.target && e.target.id==='zoomOverlay') closeZoomModal(); }
  document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeZoomModal(); });
  function renderAll(){ renderHeader(); renderStatus(); renderReminders(); renderDeviceStatus(); }
  renderAll();
  TLI_I18N.onRefresh(renderAll);
}
TLI_I18N.init();
</script>
<script src="../assets/_phase_map.js"></script>
<script src="../assets/_phase_switch.js"></script>
<script src="../assets/_idle_logout.js"></script>
</body>
