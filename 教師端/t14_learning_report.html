     依據：客戶提供的資料/學習成果報告/GateWay_個人學習成果報告_示範版_v3.docx、GateWay_20人班級學習成果報告_示範版_v3.docx；

     使用者 2026-11-24 決定：班級老師可看＋填寫評量；報告以期末完整報告示範（原型今天為 2027-03-15，班級尚未結束）。

<style>
:root{
  --c-primary:#1B4E8C;--c-primary-dark:#123A68;--c-accent:#E8792B;--c-accent-dark:#CF691F;--c-secondary:#0F9B79;
  --c-bg:#F5F7FA;--c-border:#E4E7EC;--c-muted:#667085;--c-text:#101828;
  --c-pre:#D9691C;--c-fin:#2F6DB5;
  --radius:12px;--radius-sm:8px;--shadow:0 1px 3px rgba(16,24,40,.08),0 1px 2px rgba(16,24,40,.04);--shadow-lg:0 8px 24px rgba(16,24,40,.16);
  --topbar-h:52px;--bottomnav-h:64px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--c-bg);color:var(--c-text);line-height:1.55;font-size:15px;-webkit-tap-highlight-color:transparent;}
a{color:inherit;text-decoration:none;}
img,svg{display:block;}
button{font-family:inherit;}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--c-primary);outline-offset:2px;}
.app{min-height:100vh;position:relative;}
.topbar{position:sticky;top:0;z-index:60;height:var(--topbar-h);background:#fff;border-bottom:1px solid var(--c-border);display:flex;align-items:center;justify-content:space-between;padding:0 14px;gap:10px;}
.topbar-left{display:flex;align-items:center;gap:8px;min-width:0;}
.topbar-logo-wrap{width:26px;height:22px;overflow:hidden;position:relative;flex:none;}
.topbar-logo-wrap img{position:absolute;left:0;top:0;height:22px;width:auto;max-width:none;}
.topbar-title{font-size:16.5px;font-weight:700;color:var(--c-text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.topbar-actions{display:flex;align-items:center;gap:6px;position:relative;}
.side-nav{display:none;}
@media(min-width:1024px){
  .side-nav{display:flex;flex-direction:column;position:fixed;left:0;top:0;bottom:0;width:310px;background:#fff;border-right:1px solid var(--c-border);padding:18px 12px;z-index:50;}
  .side-role{padding:0 10px 14px;margin-bottom:10px;border-bottom:1px solid var(--c-border);}
  .side-role strong{display:block;font-size:14px;color:var(--c-primary);font-weight:700;}
  .side-role span{display:block;font-size:12px;color:var(--c-muted);margin-top:2px;}
  .side-brand{display:flex;align-items:center;padding:0 8px 18px;}
  .side-brand img{height:28px;width:auto;}
  .side-link{display:flex;align-items:center;gap:10px;padding:10px 10px;border-radius:8px;font-size:14px;font-weight:600;color:var(--c-muted);margin-bottom:2px;}
  .side-link svg{width:19px;height:19px;flex:none;}
  .side-link.active{background:#E6EEF8;color:var(--c-primary);}
  .side-link:hover:not(.active){background:var(--c-bg);}
  .app.has-side .topbar{margin-left:310px;}
  .app.has-side .content{margin-left:310px;}
}
.bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:70;background:#fff;border-top:1px solid var(--c-border);display:flex;height:var(--bottomnav-h);padding-bottom:env(safe-area-inset-bottom,0);box-shadow:0 -2px 10px rgba(16,24,40,.06);}
.bottom-nav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;color:var(--c-muted);font-weight:600;min-height:44px;}
.bottom-nav a svg{width:20px;height:20px;}
.bottom-nav a.active{color:var(--c-primary);}
@media(min-width:1024px){.bottom-nav{display:none;}}
.content{max-width:1040px;margin:0 auto;padding:18px 16px calc(var(--bottomnav-h) + 24px);}
@media(min-width:1024px){.content{padding:26px 32px 40px;}}
.page-sub{color:var(--c-muted);font-size:13px;margin:0 0 12px;}
.card{background:#fff;border:1px solid var(--c-border);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px;}
.card + .card{margin-top:12px;}
.muted{color:var(--c-muted);}
.small{font-size:12px;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:var(--radius-sm);padding:11px 18px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:background .15s;min-height:44px;}
.btn-primary{background:var(--c-primary);color:#fff;}
.btn-primary:hover{background:var(--c-primary-dark);}
.btn-outline{background:#fff;border:1px solid var(--c-border);color:var(--c-text);}
.btn-outline:hover{background:var(--c-bg);}
.btn-sm{padding:7px 12px;font-size:12.5px;min-height:36px;}
.btn-link{background:none;border:none;color:var(--c-primary);font-weight:700;cursor:pointer;font-size:12.5px;padding:4px 0;font-family:inherit;}
.badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:700;white-space:nowrap;}
.badge-info{background:#E6EEF8;color:var(--c-primary);}
.badge-warn{background:#FCEBDC;color:#9A4A0F;}
.badge-ok{background:#E4F5F0;color:#0B6B52;}
.badge-muted{background:var(--c-border);color:var(--c-muted);}
.badge-danger{background:#FDE8E8;color:#B42318;}
.hidden{display:none!important;}
.toast{position:fixed;left:50%;bottom:calc(var(--bottomnav-h) + 18px);transform:translateX(-50%);background:#101828;color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;font-weight:700;z-index:120;box-shadow:var(--shadow-lg);}
.toast.hidden{display:none;}
@media(min-width:1024px){.toast{bottom:24px;}}
.select-sm{border:1px solid var(--c-border);border-radius:var(--radius-sm);padding:8px 10px;font-size:13px;font-family:inherit;background:#fff;min-height:38px;max-width:100%;}
.fchip-bar{display:flex;gap:8px;flex-wrap:wrap;}
.fchip{padding:7px 14px;border-radius:20px;border:1px solid var(--c-border);background:#fff;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--c-muted);}
.fchip.active{background:var(--c-primary);color:#fff;border-color:var(--c-primary);}
.crumb{font-size:13px;margin-bottom:10px;}
.crumb a{color:var(--c-primary);font-weight:700;}

/* 本頁 */
.demo-note{background:#FFF8EC;border:1px solid #F6D9B0;color:#7A4A12;border-radius:var(--radius-sm);padding:9px 12px;font-size:12.5px;margin-bottom:12px;}
.cls-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px;}
.cls-head h3{margin:0;font-size:17px;}
.cls-pick{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--c-muted);font-weight:600;}
.cls-pick select{min-width:260px;font-weight:600;color:var(--c-text);}
@media (max-width:640px){.cls-head{align-items:stretch;}.cls-pick,.cls-pick select{width:100%;min-width:0;}}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--c-border);margin-bottom:14px;}
.tab{background:none;border:none;border-bottom:2.5px solid transparent;padding:10px 14px;font-size:14px;font-weight:700;color:var(--c-muted);cursor:pointer;font-family:inherit;margin-bottom:-1px;}
.tab.active{color:var(--c-primary);border-bottom-color:var(--c-primary);}
.act-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:12px;}
.act-bar .btns{display:flex;gap:8px;flex-wrap:wrap;}
.info-line{font-size:12.5px;color:var(--c-muted);}
.info-line b{color:var(--c-text);}
.sec{background:#fff;border:1px solid var(--c-border);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px;margin-bottom:12px;}
.sec h4{margin:0 0 12px;font-size:15px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;}
.sec h4 .no{color:var(--c-primary);font-variant-numeric:tabular-nums;}
.sec h4 .opt{font-size:11.5px;font-weight:600;color:var(--c-muted);}
.note{font-size:12px;color:var(--c-muted);margin:10px 0 0;}
.kv{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
@media(max-width:760px){.kv{grid-template-columns:repeat(2,1fr);}}
.kv div{background:var(--c-bg);border-radius:var(--radius-sm);padding:8px 11px;font-size:11.5px;color:var(--c-muted);min-width:0;}
.kv b{display:block;font-size:13.5px;color:var(--c-text);font-weight:700;margin-top:1px;overflow-wrap:anywhere;}
.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
@media(max-width:760px){.kpi{grid-template-columns:repeat(2,1fr);}}
.kpi div{border:1px solid var(--c-border);border-radius:var(--radius-sm);padding:10px 12px;font-size:11.5px;color:var(--c-muted);}
.kpi b{display:block;font-size:21px;color:var(--c-text);font-variant-numeric:tabular-nums;line-height:1.25;margin-top:2px;}
.kpi b small{font-size:12px;color:var(--c-muted);font-weight:600;}
.crit{margin-top:12px;border:1px dashed var(--c-border);border-radius:var(--radius-sm);padding:10px 12px;font-size:12.5px;}
.crit-row{display:flex;gap:8px;align-items:flex-start;padding:3px 0;}
.crit-row .ck{flex:none;font-weight:700;width:16px;text-align:center;}
.ck-ok{color:#0B6B52;}.ck-no{color:#B42318;}
.tbl-wrap{overflow-x:auto;}
.tbl{border-collapse:collapse;width:100%;font-size:12.5px;}
.tbl th,.tbl td{padding:8px 8px;border-bottom:1px solid var(--c-border);text-align:left;vertical-align:top;}
.tbl th{background:var(--c-bg);font-size:11.5px;color:var(--c-muted);font-weight:700;white-space:nowrap;}
.tbl td.num,.tbl th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;}
.tbl tr.click{cursor:pointer;}
.tbl tr.click:hover td{background:var(--c-bg);}
.tbl tr.dim td{color:#98A2B3;}
.chart-row{display:grid;grid-template-columns:1.2fr 1fr;gap:16px;align-items:start;}
@media(max-width:820px){.chart-row{grid-template-columns:1fr;}}
.chart-box{min-width:0;}
.chart-box svg{width:100%;height:auto;}
.legend{display:flex;gap:14px;justify-content:center;font-size:12px;color:var(--c-muted);margin-top:4px;flex-wrap:wrap;}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px;}
.tag-list{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 2px;}
.tag{display:inline-block;padding:3px 10px;border-radius:14px;font-size:12px;border:1px solid var(--c-border);color:var(--c-muted);background:#fff;}
.tag.on{background:#E6EEF8;border-color:#BBD0EA;color:var(--c-primary);font-weight:700;}
.sub-h{font-size:13px;font-weight:700;margin:12px 0 4px;}
.sub-h:first-child{margin-top:0;}
details.skill{border:1px solid var(--c-border);border-radius:var(--radius-sm);margin-top:8px;}
details.skill summary{cursor:pointer;padding:9px 12px;font-size:13px;font-weight:700;display:flex;justify-content:space-between;gap:8px;list-style:none;}
details.skill summary::-webkit-details-marker{display:none;}
details.skill summary::after{content:'▾';color:var(--c-muted);}
details.skill[open] summary::after{content:'▴';}
details.skill .inner{padding:0 12px 10px;}
.sc{display:inline-flex;gap:3px;}
.sc span{width:20px;height:20px;border-radius:50%;border:1px solid var(--c-border);font-size:11px;display:inline-flex;align-items:center;justify-content:center;color:#98A2B3;}
.sc span.on{background:var(--c-fin);border-color:var(--c-fin);color:#fff;font-weight:700;}
.ov{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--c-border);border-radius:var(--radius);overflow:hidden;margin-bottom:12px;background:#fff;}
@media(max-width:640px){.ov{grid-template-columns:1fr;}}
.ov-h{grid-column:1/-1;background:var(--c-primary);color:#fff;padding:12px 16px;}
.ov-h small{display:block;font-size:11.5px;opacity:.85;}
.ov-h b{font-size:15px;}
.ov-c{padding:12px 16px;font-size:12px;color:var(--c-muted);}
.ov-c + .ov-c{border-left:1px solid var(--c-border);}
@media(max-width:640px){.ov-c + .ov-c{border-left:none;border-top:1px solid var(--c-border);}}
.ov-c h5{margin:0 0 6px;font-size:13px;color:var(--c-text);}
.ov-big{font-size:22px;font-weight:700;color:var(--c-text);font-variant-numeric:tabular-nums;}
.ov-big small{font-size:12px;color:var(--c-muted);font-weight:600;}
.ov-mini{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:6px;}
.ov-mini span b{display:block;font-size:14px;color:var(--c-text);}
.pbar{height:6px;border-radius:3px;background:var(--c-border);overflow:hidden;margin:4px 0 8px;}
.pbar i{display:block;height:100%;background:var(--c-fin);border-radius:3px;}
.rp-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:flex-start;margin-bottom:12px;}
.rp-head h3{margin:0;font-size:17px;}
.err-box{background:#FDE8E8;border:1px solid #F5C2C0;color:#B42318;border-radius:var(--radius-sm);padding:10px 12px;font-size:12.5px;margin-bottom:12px;}
.err-box ul{margin:4px 0 0;padding-left:18px;}
.edit-note{background:#E6EEF8;color:var(--c-primary);border-radius:var(--radius-sm);padding:9px 12px;font-size:12.5px;margin-bottom:12px;}
.fgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
@media(max-width:760px){.fgrid{grid-template-columns:repeat(2,1fr);}}
.fld label{display:block;font-size:12px;color:var(--c-muted);font-weight:600;margin-bottom:3px;}
.fld input,.fld textarea,.fld select{width:100%;border:1px solid var(--c-border);border-radius:var(--radius-sm);padding:8px 10px;font-size:13.5px;font-family:inherit;background:#fff;}
.fld textarea{min-height:60px;resize:vertical;}
.chk-grid{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;margin:4px 0 6px;}
.chk-grid label{display:inline-flex;gap:5px;align-items:center;cursor:pointer;}
.ind-sel{border:1px solid var(--c-border);border-radius:6px;padding:4px 6px;font-size:12.5px;font-family:inherit;background:#fff;}
.sticky-act{position:sticky;bottom:calc(var(--bottomnav-h) + 8px);background:#fff;border:1px solid var(--c-border);border-radius:var(--radius);box-shadow:var(--shadow-lg);padding:10px 14px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;z-index:40;}
@media(min-width:1024px){.sticky-act{bottom:12px;}}
.tpl{margin-top:4px;font-size:12.5px;}
.tpl summary{cursor:pointer;color:var(--c-muted);font-weight:700;padding:6px 0;}
.reset-row{text-align:right;margin-top:8px;}
/* 列印用正式標題（20261124 使用者指示：PDF 不印頁面說明與班級切換，改放正式報告標題；標題文字依客戶兩份示範版報告） */
.print-only{display:none;}
.pt-head{border-bottom:2px solid var(--c-text);padding:0 0 12px;margin:0 0 16px;}
.pt-kicker{font-size:11px;letter-spacing:.12em;color:var(--c-muted);font-weight:700;text-transform:uppercase;}
.pt-head h1{margin:6px 0 2px;font-size:24px;line-height:1.3;}
.pt-en{font-size:12px;color:var(--c-muted);}
.pt-meta{display:flex;flex-wrap:wrap;gap:4px 18px;margin-top:10px;font-size:12.5px;}
.pt-meta span{color:var(--c-muted);}
.pt-meta b{color:var(--c-text);font-weight:600;margin-left:4px;}
@media print{
  .side-nav,.topbar,.bottom-nav,.no-print,.tabs,.crumb,.demo-note,.sticky-act,.tpl,.reset-row,#ph-sw,.ph-sw,.page-sub,.cls-head,.rp-head{display:none!important;}
  .print-only{display:block!important;}
  .app.has-side .content{margin-left:0!important;}
  body{background:#fff;}
  .sec,.ov{box-shadow:none;break-inside:avoid;}
  details.skill .inner{display:block;}
}
</style>

  var s = '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+T('測驗平均分數長條圖','Test average bar chart')+'">';
  [0,25,50,75,100].forEach(function(v){ var y=Tp+ph-ph*v/100; s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'" stroke="#EEF0F3" stroke-width="1"/><text x="'+(L-6)+'" y="'+(y+4)+'" font-size="11" fill="#667085" text-anchor="end">'+v+'</text>'; });
  s += '<line x1="'+L+'" x2="'+(W-R)+'" y1="'+(Tp+ph)+'" y2="'+(Tp+ph)+'" stroke="#98A2B3" stroke-width="1"/>';
  items.forEach(function(it,i){
    var cx = L+slot*i+slot/2, x = cx-bw/2;
    if(it.v==null){ s += '<text x="'+cx+'" y="'+(Tp+ph-8)+'" font-size="12" fill="#98A2B3" text-anchor="middle">'+T('未施測','Not taken')+'</text>'; }
    else {
      var h = Math.max(1, ph*it.v/100), y = Tp+ph-h, r = Math.min(4,h);
      s += '<g><title>'+esc(it.label)+'：'+f1(it.v)+'/100'+(it.n!=null?'（n='+it.n+'）':'')+'</title><path d="M'+x+','+(Tp+ph)+' V'+(y+r)+' Q'+x+','+y+' '+(x+r)+','+y+' H'+(x+bw-r)+' Q'+(x+bw)+','+y+' '+(x+bw)+','+(y+r)+' V'+(Tp+ph)+' Z" fill="'+it.color+'"/>'+
        '<rect x="'+(cx-slot/2)+'" y="'+Tp+'" width="'+slot+'" height="'+ph+'" fill="transparent"/></g>'+
        '<text x="'+cx+'" y="'+(y-6)+'" font-size="12.5" font-weight="700" fill="#101828" text-anchor="middle">'+(it.int?f0(it.v):f1(it.v))+'</text>';
    }
    s += '<text x="'+cx+'" y="'+(Tp+ph+17)+'" font-size="12" fill="#101828" text-anchor="middle">'+esc(it.label)+'</text>';
    if(it.sub) s += '<text x="'+cx+'" y="'+(Tp+ph+33)+'" font-size="11" fill="#667085" text-anchor="middle">'+esc(it.sub)+'</text>';
  });
  return s+'</svg>';
}
function radar(series){
  var W=380, H=330, cx=190, cy=170, R=112, n=SKILLS.length;
  function pt(i, v){ var a = (-90 + 360/n*i) * Math.PI/180; return [cx + Math.cos(a)*R*v/5, cy + Math.sin(a)*R*v/5]; }
  var s = '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+T('五項核心能力雷達圖','Five-skill radar chart')+'">';
  for(var lv=1; lv<=5; lv++){ s += '<polygon points="'+SKILLS.map(function(_,i){ return pt(i,lv).join(','); }).join(' ')+'" fill="none" stroke="'+(lv===5?'#C9D1DB':'#E4E7EC')+'" stroke-width="1"/>'; }
  SKILLS.forEach(function(sk,i){ var e = pt(i,5); s += '<line x1="'+cx+'" y1="'+cy+'" x2="'+e[0]+'" y2="'+e[1]+'" stroke="#E4E7EC" stroke-width="1"/>';
    var lp = pt(i,6.05), anc = Math.abs(lp[0]-cx)<4 ? 'middle' : (lp[0]>cx ? 'start' : 'end');
    s += '<text x="'+lp[0]+'" y="'+(lp[1]+4)+'" font-size="12.5" font-weight="700" fill="#101828" text-anchor="'+anc+'">'+esc(T(sk.zh,sk.en))+'</text>'; });
  for(lv=1; lv<=5; lv++){ var q = pt(0,lv); s += '<text x="'+(q[0]+5)+'" y="'+(q[1]+4)+'" font-size="10" fill="#98A2B3">'+lv+'</text>'; }
  series.forEach(function(se){
    if(!se.vals.some(function(v){ return v!=null; })) return;
    var pts = se.vals.map(function(v,i){ return pt(i, v==null?0:v); });
    s += '<polygon points="'+pts.map(function(p){ return p.join(','); }).join(' ')+'" fill="'+se.color+'" fill-opacity=".10" stroke="'+se.color+'" stroke-width="2" stroke-linejoin="round"/>';
    pts.forEach(function(p,i){ s += '<g><title>'+esc(se.label)+'｜'+esc(T(SKILLS[i].zh,SKILLS[i].en))+'：'+f1(se.vals[i])+' / 5</title><circle cx="'+p[0]+'" cy="'+p[1]+'" r="10" fill="transparent"/><circle cx="'+p[0]+'" cy="'+p[1]+'" r="4.5" fill="'+se.color+'" stroke="#fff" stroke-width="2"/></g>'; });
  });
  s += '</svg><div class="legend">'+series.filter(function(se){ return se.vals.some(function(v){ return v!=null; }); }).map(function(se){ return '<span><i style="background:'+se.color+'"></i>'+esc(se.label)+'</span>'; }).join('')+'</div>';
  return s;
}

/* 20261124 使用者指示：假設班級老師帶多個班別，只在本頁示範。共用主檔每位老師只帶 1 班（t08–t10 不變），本頁另列同機構其他班級，讓班級切換出現 */
function myCls(){ var mine = TC.myClasses(), ids = mine.map(function(c){ return c.id; }); return mine.concat(PL.classes().filter(function(c){ return ids.indexOf(c.id)<0; })); }
var st = {cid:null, tab:PL.qs('tab')==='stu'?'stu':'class', rid:PL.qs('stu'), edit:false, tests:{pre:1,s1:1,s2:1,fin:1}, filt:'all', sfilt:'all', errs:null};
(function(){ var my = myCls(), q = PL.qs('class'); st.cid = (my.filter(function(c){ return c.id===q; })[0] || my[0] || {}).id || null; if(st.rid) st.tab='stu'; })();
function syncUrl(){ var p = ['class='+st.cid]; if(st.tab==='stu') p.push('tab=stu'); if(st.rid) p.push('stu='+st.rid); if(PL.qs('rid')) p.push('rid='+PL.qs('rid')); history.replaceState(null,'','?'+p.join('&')); }

function render(){
  var my = myCls(), c = PL.classById(st.cid);
  if(!c){ $('view').innerHTML = '<div class="card muted" style="text-align:center;">'+T('目前沒有指派給你的班級。','No classes are assigned to you yet.')+'</div>'; return; }
  $('clsTitle').textContent = c.name;
  $('clsMeta').textContent = PL.partner().name+'・'+c.from+' ～ '+c.to+'・'+T('應上 '+HOURS+' 小時（示意）', HOURS+' scheduled hours (sample)');
  $('clsPick').innerHTML = my.length>1 ? '<label class="cls-pick" for="clsSel"><span>'+T('切換班級（共 '+my.length+' 班）','Switch class ('+my.length+')')+'</span><select class="select-sm" id="clsSel">'+my.map(function(x){ return '<option value="'+x.id+'"'+(x.id===st.cid?' selected':'')+'>'+esc(x.name)+T('（'+stuList(x.id).length+' 人）',' ('+stuList(x.id).length+')')+'</option>'; }).join('')+'</select></label>' : '';
  if($('clsSel')) $('clsSel').onchange = function(){ st.cid=this.value; st.rid=null; st.edit=false; st.errs=null; st.filt='all'; st.sfilt='all'; window.scrollTo(0,0); render(); };
  document.querySelectorAll('.tab').forEach(function(b){ b.classList.toggle('active', b.dataset.tab===st.tab); b.setAttribute('aria-selected', b.dataset.tab===st.tab); b.onclick=function(){ st.tab=b.dataset.tab; st.rid=null; st.edit=false; st.errs=null; render(); }; });
  if(st.tab==='class') renderClass(c); else if(st.rid) (st.edit ? renderEdit(c) : renderPersonal(c)); else renderStuList(c);
  syncUrl(); PL.xl(document);
}

    SKILLS.map(function(s,i){ return '<tr><td>'+T(s.zh,s.en)+'</td><td class="num">'+f1(pre[i])+'</td><td class="num"><b>'+f1(fin[i])+'</b></td><td class="small">'+(d.obs[s.k]?esc(d.obs[s.k]):'<span class="muted">—</span>')+'</td></tr>'; }).join('')+'</tbody></table></div></div>'+
    SKILLS.map(function(s){ return '<details class="skill"><summary><span>'+T(s.zh,s.en)+'<span class="small muted" style="font-weight:400;">（'+T(s.d[0],s.d[1])+'）</span></span></summary><div class="inner"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>'+T('代號','Code')+'</th><th>'+T('評估指標','Indicator')+'</th><th>'+T('期初','Pre')+'</th><th>'+T('期末','Final')+'</th></tr></thead><tbody>'+
      s.ind.map(function(t,j){ return '<tr><td>'+s.k+(j+1)+'</td><td>'+esc(t[0])+'<div class="small muted">'+esc(t[1])+'</div></td><td>'+scoreDots(d.ind.pre[s.k][j])+'</td><td>'+scoreDots(d.ind.fin[s.k][j])+'</td></tr>'; }).join('')+'</tbody></table></div></div></details>'; }).join('')+
    '<p class="note">'+T('評分量尺：1 尚未掌握｜2 初步掌握｜3 基本掌握｜4 良好掌握｜5 熟練掌握。能力分數為 5 個指標的平均；期初與期末採同一規準，雷達圖依分數自動產生。','Scale: 1 Not yet | 2 Emerging | 3 Developing | 4 Proficient | 5 Advanced. Skill score = mean of 5 indicators; pre and final use the same rubric.')+'</p>');
  /* 05 */
  if(TASKS_ON) h += sec('05', T('情境任務達成','Scenario tasks'), '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>'+T('情境任務','Task')+'</th><th>'+T('達成情況','Result')+'</th></tr></thead><tbody>'+
    TASKS.map(function(t,i){ var v = d.sc[i], m = TASK_ST[v]; return '<tr><td>'+T(t[0],t[1])+'</td><td>'+(m?'<span class="badge '+m[2]+'">'+T(m[0],m[1])+'</span>':'<span class="muted">—</span>')+'</td></tr>'; }).join('')+'</tbody></table></div>', T('選用模組・由教務依課程開啟','Optional, enabled per course'));
  /* 06 */
  h += sec('06', T('TLI Connect 自學影片與單元測驗','TLI Connect self-study'), '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>'+T('自學指標','Measure')+'</th><th class="num">'+T('結果','Result')+'</th><th>'+T('資料來源','Source')+'</th></tr></thead><tbody>'+
    '<tr><td>'+T('指定自學影片完成率','Assigned video completion')+'</td><td class="num">'+d.vid+'%（'+d.vidN+'/'+d.vidT+'）</td><td>'+T('影片學習紀錄','Video records')+'</td></tr>'+
    '<tr><td>'+T('單元測驗完成率','Unit quiz completion')+'</td><td class="num">'+Math.round(d.qc/d.qcT*100)+'%（'+d.qc+'/'+d.qcT+'）</td><td>'+T('測驗系統','Quiz system')+'</td></tr>'+
    '<tr><td>'+T('單元測驗平均分數','Unit quiz average')+'</td><td class="num">'+(d.quiz==null?'—':d.quiz+' / 100')+'</td><td>'+T('測驗系統','Quiz system')+'</td></tr></tbody></table></div>');
  /* 07 */
  h += sec('07', T('教師綜合評語與改善建議','Teacher comments'),
    '<div class="sub-h">'+T('學習優勢','Strengths')+'</div>'+(d.str.length||d.strOther?tags(STR_P, d.str, d.strOther):'<div class="muted small">—</div>')+
    (d.note?'<div class="small" style="margin-top:6px;"><b>'+T('教師個別補充：','Teacher note: ')+'</b>'+esc(d.note)+'</div>':'')+
    '<div class="sub-h" style="margin-top:12px;">'+T('改善方向','Areas to improve')+'</div>'+(d.imp.length||d.impOther?tags(IMP_P, d.imp, d.impOther):'<div class="muted small">—</div>')+
    (d.advice?'<div class="small" style="margin-top:6px;"><b>'+T('具體學習建議：','Suggestion: ')+'</b>'+esc(d.advice)+'</div>':''));
  /* 08 */
  h += sec('08', T('下一階段學習建議','Next step'), '<div class="small">'+(d.next?'<b>'+T('建議課程：','Suggested course: ')+'</b>'+esc(d.next):'<span class="muted">—</span>')+'</div><p class="note">'+T('系統建議＋教師確認，不作正式能力證明。','System suggestion confirmed by the teacher; not a formal certificate.')+'</p>');
  /* 09 */
  h += sec('09', T('填報與審核','Preparation & review'), '<div class="kv"><div>'+T('填報人','Prepared by')+'<b>'+esc(TC.ME.name)+T(' 老師','')+'</b></div><div>'+T('審核單位','Reviewer')+'<b>'+T('TLI 教學研究與發展部','TLI Teaching R&D')+'</b></div><div>'+T('報告狀態','Status')+'<b>'+stBadge(d.status)+'</b></div><div>'+T('版本／最後更新','Version / updated')+'<b>v'+d.ver+'・'+slash(d.updated)+'</b></div></div>'+
    '<p class="note">'+T('發布後若要修改，系統會產生新版本並重新送審，保留歷次版本。','Revising a published report creates a new version that goes through review again; earlier versions are kept.')+'</p>');
  h += tplPanel();
  $('view').innerHTML = h;
  $('back').onclick = function(e){ e.preventDefault(); st.rid=null; render(); };
  $('btnPdf1').onclick = function(){ document.querySelectorAll('details.skill').forEach(function(x){ x.open = true; }); printAs(r.name+'_'+T('個別學員學習成果報告','Student learning report')); };
  if($('btnEdit')) $('btnEdit').onclick = function(){ st.edit=true; st.errs=null; render(); window.scrollTo(0,0); };
  if($('btnRev')) $('btnRev').onclick = function(){
    if(!confirm(T('要修改「'+r.name+'」的已發布報告嗎？會產生 v'+(d.ver+1)+' 草稿，送審發布前全班報告仍採用 v'+d.ver+'。','Revise the published report for '+r.name+'? A v'+(d.ver+1)+' draft will be created.'))) return;
    /* 新版本存成草稿；上一版已發布內容存在 prevPub，新版發布前全班報告仍用它 */
    var nd = JSON.parse(JSON.stringify(d)); nd.status='draft'; nd.ver=d.ver+1; nd.updated=DEMO_TODAY; nd.prevPub=JSON.parse(JSON.stringify(d)); DB[st.rid]=nd; saveDB(); st.edit=true; st.errs=null; render(); window.scrollTo(0,0);
  };
}
function scoreDots(v){
  return '<span class="sc">'+[1,2,3,4,5].map(function(n){ return '<span class="'+(v==n?'on':'')+'">'+n+'</span>'; }).join('')+'</span>'+(v==null?' <span class="small muted">'+T('未評','—')+'</span>':'');
}

/* ================= 填寫評量 ================= */
function renderEdit(c){
  var r = PL.rosterById(st.rid), d = rep(st.rid);
  function indSel(ph, k, j){ var v = d.ind[ph][k][j]; return '<select class="ind-sel" data-ph="'+ph+'" data-k="'+k+'" data-j="'+j+'" aria-label="'+k+(j+1)+' '+(ph==='pre'?T('期初','pre'):T('期末','final'))+'"><option value="">—</option>'+[1,2,3,4,5].map(function(n){ return '<option value="'+n+'"'+(v==n?' selected':'')+'>'+n+' '+T(SCALE[n-1][0],SCALE[n-1][1])+'</option>'; }).join('')+'</select>'; }
  function cb(list, on, name){ return '<div class="chk-grid" id="'+name+'">'+list.map(function(t,i){ return '<label><input type="checkbox" value="'+i+'"'+(on.indexOf(i)>=0?' checked':'')+'>'+esc(T(t[0],t[1]))+'</label>'; }).join('')+'</div>'; }
  var h = '<div class="crumb"><a href="#" id="back">‹ '+T('個人報告列表','Student reports')+'</a></div>'+
    '<div class="rp-head"><div><h3>'+T('填寫評量','Fill in assessment')+'：'+esc(r.name)+'</h3><div class="small muted">'+esc(c.name)+'・'+stBadge(d.status)+' v'+d.ver+'</div></div></div>'+
    '<div class="edit-note">'+T('可先「儲存草稿」，全部填完再「送出審核」。送出後由 TLI 教學研究與發展部審核，發布前不能再修改。','Save a draft any time; submit when complete. After submission TLI Teaching R&D reviews it, and it can\'t be edited until published.')+'</div>';
  if(st.errs && st.errs.length) h += '<div class="err-box" role="alert"><b>'+T('還有 '+st.errs.length+' 項需要處理才能送出：','Fix '+st.errs.length+' item(s) before submitting:')+'</b><ul>'+st.errs.map(function(e){ return '<li>'+esc(e)+'</li>'; }).join('')+'</ul></div>';
  /* 出席與測驗 */
  h += sec('02・03', T('出席與測驗成績','Attendance & tests'), '<div class="fgrid"><div class="fld"><label for="eAtt">'+T('實際出席時數（應上 '+HOURS+'）','Hours attended (of '+HOURS+')')+'</label><input id="eAtt" type="number" min="0" max="'+HOURS+'" step="0.5" value="'+(d.att==null?'':d.att)+'"></div></div>'+
    '<p class="note" style="margin-top:4px;">'+T('點名系統尚未串接時，由教師補登出席時數。','Enter attendance manually until roll call is connected.')+'</p>'+
    '<div class="fgrid" style="margin-top:10px;">'+TEST_KEYS.map(function(k){ return '<div class="fld"><label for="eT_'+k+'">'+testName(k)+'（/100）</label><input id="eT_'+k+'" type="number" min="0" max="100" step="1" value="'+(d.tests[k]==null?'':d.tests[k])+'" placeholder="'+T('未施測','Not taken')+'"></div>'; }).join('')+'</div>'+
    '<p class="note" style="margin-top:4px;">'+T('留白表示未施測，不會以 0 分計算。','Leave blank if not taken; it is never counted as 0.')+'</p>');
  /* 五項能力 */
  h += sec('04', T('五項核心能力評量','Five core skills'), '<p class="small muted" style="margin:-4px 0 6px;">'+T('每項能力 5 個指標，依課堂表現評 1–5 分。期初與期末採同一規準。','Rate each of the 5 indicators 1–5 from class performance. Pre and final use the same rubric.')+'</p>'+
    SKILLS.map(function(s,si){ return '<details class="skill"'+(si===0?' open':'')+'><summary><span>'+T(s.zh,s.en)+'<span class="small muted" style="font-weight:400;">（'+T(s.d[0],s.d[1])+'）</span></span></summary><div class="inner"><div class="tbl-wrap"><table class="tbl" style="min-width:560px;"><thead><tr><th>'+T('代號','Code')+'</th><th>'+T('評估指標','Indicator')+'</th><th>'+T('期初','Pre')+'</th><th>'+T('期末','Final')+'</th></tr></thead><tbody>'+
      s.ind.map(function(t,j){ return '<tr><td>'+s.k+(j+1)+'</td><td>'+esc(t[0])+'<div class="small muted">'+esc(t[1])+'</div></td><td>'+indSel('pre',s.k,j)+'</td><td>'+indSel('fin',s.k,j)+'</td></tr>'; }).join('')+
      '</tbody></table></div><div class="fld" style="margin-top:8px;"><label for="eObs_'+s.k+'">'+T('教師觀察（選填）','Teacher note (optional)')+'</label><input id="eObs_'+s.k+'" value="'+esc(d.obs[s.k]||'')+'"></div></div></details>'; }).join(''));
  /* 情境任務 */
  if(TASKS_ON) h += sec('05', T('情境任務達成','Scenario tasks'), '<div class="tbl-wrap"><table class="tbl"><tbody>'+TASKS.map(function(t,i){ return '<tr><td>'+T(t[0],t[1])+'</td><td style="width:200px;"><select class="ind-sel" id="eSc_'+i+'" aria-label="'+esc(T(t[0],t[1]))+'"><option value="">—</option>'+['I','H','N','X'].map(function(k){ return '<option value="'+k+'"'+(d.sc[i]===k?' selected':'')+'>'+T(TASK_ST[k][0],TASK_ST[k][1])+'</option>'; }).join('')+'</select></td></tr>'; }).join('')+'</tbody></table></div>');
  /* 評語 */
  h += sec('07', T('教師綜合評語與改善建議','Teacher comments'),
    '<div class="sub-h">'+T('學習優勢（複選 2–3 項）','Strengths (choose 2–3)')+'</div>'+cb(STR_P, d.str, 'eStr')+'<div class="fgrid"><div class="fld" style="grid-column:span 2;"><label for="eStrO">'+T('其他（選填）','Other (optional)')+'</label><input id="eStrO" value="'+esc(d.strOther)+'"></div></div>'+
    '<div class="fld" style="margin-top:8px;"><label for="eNote">'+T('教師個別補充','Teacher note')+'</label><textarea id="eNote">'+esc(d.note)+'</textarea></div>'+
    '<div class="sub-h" style="margin-top:12px;">'+T('改善方向（複選 1–3 項）','Areas to improve (choose 1–3)')+'</div>'+cb(IMP_P, d.imp, 'eImp')+'<div class="fgrid"><div class="fld" style="grid-column:span 2;"><label for="eImpO">'+T('其他（選填）','Other (optional)')+'</label><input id="eImpO" value="'+esc(d.impOther)+'"></div></div>'+
    '<div class="fld" style="margin-top:8px;"><label for="eAdv">'+T('具體學習建議','Specific suggestion')+'</label><textarea id="eAdv">'+esc(d.advice)+'</textarea></div>');
  h += sec('08', T('下一階段學習建議','Next step'), '<div class="fld"><label for="eNext">'+T('建議課程（系統預填，教師確認）','Suggested course (prefilled; confirm)')+'</label><input id="eNext" value="'+esc(d.next)+'"></div>');
  h += '<div class="sticky-act"><button class="btn btn-outline btn-sm" id="eCancel">'+T('取消','Cancel')+'</button><button class="btn btn-outline btn-sm" id="eSave">'+T('儲存草稿','Save draft')+'</button><button class="btn btn-primary btn-sm" id="eSubmit">'+T('送出審核','Submit for review')+'</button></div>';
  $('view').innerHTML = h;
  $('back').onclick = $('eCancel').onclick = function(e){ if(e) e.preventDefault(); st.edit=false; st.errs=null; render(); };
  function collect(){
    var nd = JSON.parse(JSON.stringify(d)), num = function(id){ var v = $(id).value.trim(); return v==='' ? null : +v; };
    nd.att = num('eAtt'); TEST_KEYS.forEach(function(k){ nd.tests[k] = num('eT_'+k); });
    document.querySelectorAll('select[data-ph]').forEach(function(s){ var v = s.value; nd.ind[s.dataset.ph][s.dataset.k][+s.dataset.j] = v==='' ? null : +v; });
    SKILLS.forEach(function(s){ nd.obs[s.k] = $('eObs_'+s.k).value.trim(); });
    if(TASKS_ON) TASKS.forEach(function(_,i){ nd.sc[i] = $('eSc_'+i).value; });
    nd.str = checked('eStr'); nd.imp = checked('eImp'); nd.strOther = $('eStrO').value.trim(); nd.impOther = $('eImpO').value.trim();
    nd.note = $('eNote').value.trim(); nd.advice = $('eAdv').value.trim(); nd.next = $('eNext').value.trim(); nd.updated = DEMO_TODAY;
    return nd;
  }
  function validate(nd){
    var e = [];
    if(nd.att==null) e.push(T('請填實際出席時數','Enter hours attended'));
    else if(nd.att<0 || nd.att>HOURS) e.push(T('出席時數須在 0–'+HOURS+' 之間','Hours must be 0–'+HOURS));
    TEST_KEYS.forEach(function(k){ var v = nd.tests[k]; if(v!=null && (v<0 || v>100)) e.push(testName(k)+T(' 須在 0–100 之間',' must be 0–100')); });
    SKILLS.forEach(function(s){ var miss = nd.ind.fin[s.k].filter(function(v){ return v==null; }).length; if(miss) e.push(T(s.zh+'：期末還有 '+miss+' 個指標未評', s.en+': '+miss+' final indicator(s) not rated')); });
    if(TASKS_ON){ var m = nd.sc.filter(function(v){ return !v; }).length; if(m) e.push(T('情境任務還有 '+m+' 項未選（無法評量請選「未評量」）', m+' scenario task(s) not set')); }
    var ns = nd.str.length + (nd.strOther?1:0), ni = nd.imp.length + (nd.impOther?1:0);
    if(ns<2 || ns>3) e.push(T('學習優勢請選 2–3 項（含其他）','Choose 2–3 strengths'));
    if(ni<1 || ni>3) e.push(T('改善方向請選 1–3 項（含其他）','Choose 1–3 areas to improve'));
    return e;
  }
  $('eSave').onclick = function(){ var nd = collect(); if(nd.status!=='draft') nd.status='draft'; DB[st.rid] = nd; saveDB(); st.errs=null; TC.toast(T('草稿已儲存','Draft saved')); st.edit=false; render(); window.scrollTo(0,0); };
  $('eSubmit').onclick = function(){
    var nd = collect(), e = validate(nd);
    if(e.length){ DB[st.rid] = Object.assign(nd, {status:'draft'}); saveDB(); st.errs = e; render(); window.scrollTo(0,0); return; }
    nd.status = 'review'; DB[st.rid] = nd; saveDB(); st.errs=null; st.edit=false; TC.toast(T('已送出，等待 TLI 審核','Submitted for TLI review')); render(); window.scrollTo(0,0);
  };
}

$('btnReset').onclick = function(){ if(!confirm(T('要把學習報告的示範資料還原成預設值嗎？','Reset learning report demo data?'))) return; DB = {}; saveDB(); st.rid=null; st.edit=false; st.errs=null; render(); TC.toast(T('已重設示範資料','Demo data reset')); };
var AUTO_PRINT = PL.qs('print')==='1'; /* 要在第一次 render 前讀，render 會重寫網址把 print 拿掉 */
TLI_I18N.onRefresh(render);
render();
TLI_I18N.init();
/* 20261124 使用者指示：我的班級卡片「下載班級學習報告」帶 print=1 進來，直接開啟班級報告的 PDF 下載（同「下載 PDF」按鈕；網址重寫時 print 參數會被拿掉，重新整理不會再觸發） */
if(AUTO_PRINT && st.cid){ st.tab='class'; st.rid=null; st.edit=false; render(); setTimeout(function(){ if($('btnPdf')) $('btnPdf').click(); }, 400); }
PL.xl(document);
</script>
