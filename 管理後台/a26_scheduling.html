*{box-sizing:border-box;}
body{margin:0;font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,-apple-system,sans-serif;
background:var(--g50);color:var(--g900);}
a{color:var(--navy);}
.app{display:flex;min-height:100vh;width:100%;background:#fff;}
.sidebar{width:260px;flex-shrink:0;background:#fff;color:var(--g900);padding:18px 0;

position:sticky;top:0;height:100vh;align-self:flex-start;}

.sidebar nav a,.sidebar nav span.disabled{display:flex;align-items:center;gap:10px;padding:9px 20px;font-size:13.5px;

.sidebar nav a .navicon{flex-shrink:0;color:var(--g500);}
.sidebar nav a:hover{background:var(--g50);}
.sidebar nav a.active{background:#E6EEF8;color:var(--navy);font-weight:600;}
.sidebar nav a.active .navicon{color:var(--navy);}
.sidebar .sec-label{padding:16px 20px 4px;font-size:10.5px;color:var(--g500);letter-spacing:.08em;text-transform:uppercase;font-weight:600;}
.sidebar-user{padding:14px 20px 16px;border-top:1px solid var(--g200);margin-top:6px;display:flex;align-items:center;gap:10px;position:relative;}
.sidebar-user .su-avatar{width:32px;height:32px;border-radius:50%;background:var(--navy);color:#fff;display:flex;

.sidebar-user .su-info{display:flex;flex-direction:column;line-height:1.4;}
.sidebar-user .su-name{font-size:13px;font-weight:600;color:var(--g900);}

.sidebar .su-logout:hover{text-decoration:underline;}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:0 32px;height:56px;
border-bottom:1px solid var(--g200);position:sticky;top:0;background:#fff;z-index:40;margin:-26px -32px 22px;gap:14px;}

.topbar .tb-actions{display:flex;align-items:center;gap:14px;position:relative;flex-shrink:0;}

.tb-notifitem:hover{background:var(--g50);}
.tb-notifitem.unread{background:#EEF3FA;}
.tb-notifitem .tn-t{color:var(--g500);font-size:11px;margin-top:2px;}
.tb-avatarmenu{width:150px;padding:6px;}
.tb-avatarmenu a{display:block;padding:8px 10px;font-size:13px;color:var(--g900);text-decoration:none;border-radius:6px;}
.tb-avatarmenu a:hover{background:var(--g50);}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);

opacity:0;pointer-events:none;transition:.2s;z-index:200;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.sidebar-backdrop{display:none;position:fixed;inset:0;background:rgba(16,24,40,.4);z-index:110;}
.sidebar-user{padding:14px 20px 16px;border-top:1px solid var(--g200);margin-top:6px;position:relative;}
.su-clickarea{display:flex;align-items:center;gap:10px;cursor:pointer;min-width:0;}
.su-info{flex:1;min-width:0;}
.su-name,.su-unit{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.su-menu a{display:block;padding:8px 10px;font-size:13px;color:var(--g900);text-decoration:none;border-radius:6px;}
.su-menu a:hover{background:var(--g50);}
.sidebar-user .su-avatar{width:32px;height:32px;border-radius:50%;background:var(--navy);color:#fff;display:flex;
align-items:center;justify-content:center;font-size:13px;font-weight:600;flex-shrink:0;}
.sidebar-user .su-info{display:flex;flex-direction:column;line-height:1.5;}
.sidebar-user .su-name{font-size:13px;font-weight:600;color:var(--g900);}
.sidebar-user .su-roletag{font-size:10.5px;background:#E6EEF8;color:var(--navy);padding:0 6px;border-radius:8px;display:inline-block;width:fit-content;white-space:nowrap;}
.sidebar-user .su-unit{font-size:11px;color:var(--g500);}
.su-menu{top:auto;bottom:64px;left:14px;right:14px;}

@media (max-width:1279px) and (min-width:1024px){
  .sidebar{width:72px;}

    box-shadow:0 4px 12px rgba(16,24,40,.12);opacity:0;pointer-events:none;transition:opacity .12s;margin-left:6px;color:var(--g900);}

}

.switch .slider:before{content:'';position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.15s;}
.switch input:checked+.slider{background:var(--teal);}
.switch input:checked+.slider:before{transform:translateX(16px);}

function inPhase(l){ return l.campus === '線上' || !window.TLI_PHASE || TLI_PHASE.atLeast('2'); }

var VIEW = {tab:'single', st:'published', sortKey:'date', sortDir:'desc', f:{campus:'', lang:'', stu:'', tch:'', setter:''}};

/* ---------- 分頁 ---------- */
function renderTypeTabs(){
  var tabs = TYPES.map(function(t){ return {id:t.id, label:T(t.zh, t.en)}; });
  tabs.push({id:'rule', label:T('課程有效月數設定', 'Course Validity Settings')});
  document.getElementById('typeTabs').innerHTML = tabs.map(function(t){
    return '<button type="button" class="'+(VIEW.tab===t.id?'active':'')+'" onclick="switchTab(\''+t.id+'\')">'+esc(t.label)+'</button>';
  }).join('');
  var isRule = VIEW.tab === 'rule';
  document.getElementById('paneList').hidden = isRule;
  document.getElementById('paneRule').hidden = !isRule;
  document.getElementById('btnNew').hidden = isRule;
}
function switchTab(id){
  VIEW.tab = id; VIEW.st = 'published';
  closeRowMenu();
  renderTypeTabs();
  if (id === 'rule') renderRules(); else { renderFilters(); renderList(); }
}
function renderStateTabs(){
  function cnt(st){ return LESSONS.filter(function(l){ return l.type === VIEW.tab && l.st === st && inPhase(l); }).length; }
  var items = [{id:'published', zh:'已發布', en:'Published'}, {id:'pre', zh:'已預排', en:'Pre-scheduled'}];
  document.getElementById('stateTabs').innerHTML = items.map(function(s){
    return '<button type="button" class="'+(VIEW.st===s.id?'active':'')+'" onclick="switchState(\''+s.id+'\')">'+esc(T(s.zh, s.en))+'<span class="cnt">'+cnt(s.id)+'</span></button>';
  }).join('');
}
function switchState(st){ VIEW.st = st; closeRowMenu(); renderList(); }

/* ---------- 篩選（各欄模糊搜尋，可與排序同時使用：驗收 3-18） ---------- */
function renderFilters(){
  var grp = VIEW.tab !== 'single';
  var defs = [
    {k:'campus', ph:T('校區', 'Campus')},
    {k:'lang',   ph:T('教授語言', 'Teaching Language')},
    {k:'stu',    ph:grp ? T('學生名單 / Email', 'Student List / Email') : T('學生姓名 / Email', 'Student Name / Email')},
    {k:'tch',    ph:T('老師姓名 / Email', 'Teacher Name / Email')},
    {k:'setter', ph:T('設定人 / Email', 'Set By / Email')}
  ];
  document.getElementById('filterBar').innerHTML =
    '<span class="flabel">'+esc(T('搜尋', 'Search'))+'</span>' +
    defs.map(function(d){
      return '<input type="search" placeholder="'+esc(d.ph)+'" value="'+esc(VIEW.f[d.k])+'" oninput="setFilter(\''+d.k+'\',this.value)">';
    }).join('') +
    '<a href="javascript:void(0)" class="clr" onclick="clearFilters()">'+esc(T('清除篩選', 'Clear Filters'))+'</a>';
}
function setFilter(k, v){ VIEW.f[k] = v; renderList(); }
function clearFilters(){ VIEW.f = {campus:'', lang:'', stu:'', tch:'', setter:''}; renderFilters(); renderList(); }
function hit(hay, q){ q = (q || '').trim().toLowerCase(); return !q || String(hay).toLowerCase().indexOf(q) >= 0; }
function personText(p){ return p.n + ' ' + p.e; }

/* ---------- 排序：課程日期（預設降序）、課程時間（依開始時間）、最新更新時間 ---------- */
function setSort(k){
  if (VIEW.sortKey === k) VIEW.sortDir = VIEW.sortDir === 'desc' ? 'asc' : 'desc';
  else { VIEW.sortKey = k; VIEW.sortDir = 'desc'; }
  renderList();
}
function sortVal(l){
  if (VIEW.sortKey === 'date') return l.date + ' ' + l.s;
  if (VIEW.sortKey === 'time') return l.s + ' ' + l.date;
  return l.upd;
}

function personCell(p){ return '<div class="nm">'+esc(p.n)+'</div><div class="em">'+esc(p.e)+'</div>'; }
function rosterCell(l){
  var first = STU[l.stu[0]], others = l.stu.length - 1;
  var more = others > 0 ? '<span class="more" onmouseenter="showStuPop(event,\''+l.id+'\')" onmouseleave="hideStuPop()">'+esc(T('及其他 '+others+' 人', 'and '+others+' others'))+'</span>' : '';
  return '<div class="nm">'+esc(first.n)+'</div><div class="em">'+esc(first.e)+'</div>'+more;
}

function renderList(){
  renderStateTabs();
  var grp = VIEW.tab !== 'single';
  var f = VIEW.f;
  var rows = LESSONS.filter(function(l){
    if (l.type !== VIEW.tab || l.st !== VIEW.st || !inPhase(l)) return false;
    var stuHay = l.stu.map(function(id){ return personText(STU[id]); }).join(' ');
    return hit(l.campus, f.campus) && hit(l.lang, f.lang) && hit(stuHay, f.stu) &&
           hit(personText(TCH[l.tch]), f.tch) && hit(personText(STAFF[l.setter]), f.setter);
  });
  rows.sort(function(a, b){
    var x = sortVal(a), y = sortVal(b);
    return (x < y ? -1 : x > y ? 1 : 0) * (VIEW.sortDir === 'desc' ? -1 : 1);
  });
  function sh(k, zh, en){
    var on = VIEW.sortKey === k;
    return '<th class="sortable" onclick="setSort(\''+k+'\')">'+esc(T(zh, en))+'<span class="arr'+(on?' on':'')+'">'+(on ? (VIEW.sortDir === 'desc' ? '↓' : '↑') : '↕')+'</span></th>';
  }
  var head = '<tr><th>'+esc(T('校區', 'Campus'))+'</th><th>'+esc(T('教授語言', 'Teaching Language'))+'</th>' +
    sh('date', '課程日期', 'Class Date') + sh('time', '課程時間', 'Class Time') +
    (grp ? '<th>'+esc(T('班級名稱', 'Class Name'))+'</th><th>'+esc(T('學生名單 / Email', 'Student List / Email'))+'</th>'
         : '<th>'+esc(T('學生姓名 / Email', 'Student Name / Email'))+'</th>') +
    '<th>'+esc(T('老師姓名 / Email', 'Teacher Name / Email'))+'</th><th>'+esc(T('設定人 / Email', 'Set By / Email'))+'</th>' +
    sh('upd', '最新更新時間', 'Last Updated') + '<th style="width:44px"></th></tr>';
  var colspan = grp ? 11 : 10;
  var body = rows.length ? rows.map(function(l){
    return '<tr>' +
      '<td class="nowrap">'+esc(l.campus)+'</td><td class="nowrap">'+esc(l.lang)+'</td>' +
      '<td class="nowrap">'+esc(l.date)+'</td><td class="nowrap">'+esc(l.s+'–'+l.e)+'</td>' +
      (grp ? '<td>'+esc(l.cls)+'</td><td>'+rosterCell(l)+'</td>' : '<td>'+personCell(STU[l.stu[0]])+'</td>') +
      '<td>'+personCell(TCH[l.tch])+'</td><td>'+personCell(STAFF[l.setter])+'</td>' +
      '<td class="nowrap">'+esc(l.upd)+'</td>' +
      '<td><button type="button" class="kebab" aria-label="'+esc(T('更多操作', 'More actions'))+'" onclick="openRowMenu(event,\''+l.id+'\')">⋯</button></td>' +
    '</tr>';
  }).join('') : '<tr><td colspan="'+colspan+'" class="empty">'+esc(T('沒有符合條件的排課', 'No matching schedules'))+'</td></tr>';
  document.getElementById('schedTable').innerHTML = head + body;
  document.getElementById('listHint').textContent = T(
    '課程日期、課程時間與最新更新時間可點欄位標題排序；設定人與最新更新時間取異動記錄最新一筆；時間為 24 小時制（GMT+8）。',
    'Click Class Date, Class Time or Last Updated to sort. Set By and Last Updated come from the latest change log entry. Times are 24-hour (GMT+8).');
}

/* ---------- 學生名單浮動框 ---------- */
function showStuPop(ev, id){
  var l = LESSONS.filter(function(x){ return x.id === id; })[0]; if (!l) return;
  var pop = document.getElementById('stuPop');
  pop.innerHTML = l.stu.slice(1).map(function(sid){ var p = STU[sid]; return '<div><b>'+esc(p.n)+'</b> / '+esc(p.e)+'</div>'; }).join('');
  var r = ev.target.getBoundingClientRect();
  pop.classList.add('open');
  var left = Math.min(r.left, window.innerWidth - pop.offsetWidth - 12);
  var top = r.bottom + 6;
  if (top + pop.offsetHeight > window.innerHeight - 8) top = r.top - pop.offsetHeight - 6;
  pop.style.left = Math.max(8, left) + 'px'; pop.style.top = top + 'px';
}
function hideStuPop(){ document.getElementById('stuPop').classList.remove('open'); }

/* ---------- ⋯ 操作選單 ---------- */
var menuRowId = null;
function openRowMenu(ev, id){
  ev.stopPropagation();
  var m = document.getElementById('rowMenu');
  if (m.classList.contains('open') && menuRowId === id){ closeRowMenu(); return; }
  menuRowId = id;
  m.innerHTML = '<button type="button" onclick="openPending(\'edit\')">'+esc(T('編輯', 'Edit'))+'</button>' +
                '<button type="button" class="del" onclick="openDel()">'+esc(T('刪除', 'Delete'))+'</button>';
  m.classList.add('open'); menuOpenedAt = Date.now();
  var r = ev.currentTarget.getBoundingClientRect();
  var top = r.bottom + 4;
  if (top + m.offsetHeight > window.innerHeight - 8) top = r.top - m.offsetHeight - 4;
  m.style.top = top + 'px';
  m.style.left = Math.max(8, r.right - m.offsetWidth) + 'px';
}
function closeRowMenu(){ var m = document.getElementById('rowMenu'); if (m) m.classList.remove('open'); }
document.addEventListener('click', function(ev){ var m = document.getElementById('rowMenu'); if (m && !m.contains(ev.target)) closeRowMenu(); });
var menuOpenedAt = 0;
window.addEventListener('scroll', function(){ if (Date.now() - menuOpenedAt > 400) closeRowMenu(); }, true);

  {type:'single', lang:'中文', max:10, months:2, status:'active', created:'2026-10-15', archived:'', by:'hq'},
  {type:'single', lang:'中文', max:20, months:3, status:'active', created:'2026-10-15', archived:'', by:'hq'},
  {type:'group',  lang:'中文', max:8,  months:2, status:'active', created:'2026-10-15', archived:'', by:'hq'},
  {type:'group',  lang:'中文', max:16, months:3, status:'active', created:'2026-10-15', archived:'', by:'hq'}
];
function todayStr(){ var d = new Date(); function p(n){ return (n < 10 ? '0' : '') + n; } return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); }
function langOptions(){
  var list = (window.TLI_MASTERS && TLI_MASTERS.teachLangs) ? TLI_MASTERS.teachLangs.filter(function(x){ return x.enabled; }).map(function(x){ return x.name; }) : ['中文', '英文', '日文', '台語'];
  return list;
}
function renderRules(){
  document.getElementById('ruleAdminNote').textContent = T('此功能僅限具「管理員」權限的使用者可進入與操作。', 'Only users with the Administrator permission can access this setting.');
  document.getElementById('ruleTypeSeg').innerHTML = TYPES.filter(function(t){ return t.id !== 'term'; }).map(function(t){
    return '<button type="button" class="'+(RULE_TYPE===t.id?'on':'')+'" onclick="switchRuleType(\''+t.id+'\')">'+esc(T(t.zh, t.en))+'</button>';
  }).join('');
  document.getElementById('ruleAddTitle').textContent = T('新增規則', 'Add Rule');
  document.getElementById('ruleAddHint').textContent = T('滿堂數(堂)為設定門檻，代表「購買堂數 ≤ 此值」時適用該規則；有效月數(月)為課程期限，系統依此值計算課時到期日',
    'Max lessons is the threshold: the rule applies when purchased lessons ≤ this value. Valid months sets the course term used to calculate the lesson expiry date.');
  document.getElementById('lbLang').textContent = T('語言', 'Language');
  document.getElementById('lbMax').textContent = T('滿堂數(堂)', 'Max Lessons');
  document.getElementById('lbMonths').textContent = T('有效月數(月)', 'Valid Months');
  document.getElementById('btnAddRule').textContent = T('新增規則', 'Add Rule');
  var sel = document.getElementById('ruleLang'), cur = sel.value;
  sel.innerHTML = langOptions().map(function(n){ return '<option'+(n===cur?' selected':'')+'>'+esc(n)+'</option>'; }).join('');
  document.getElementById('ruleMonths').placeholder = T('最低 1 個月', 'Minimum 1');
  document.getElementById('ruleListTitle').textContent = T('規則列表', 'Rules') + '・' + typeName(RULE_TYPE);

  var rows = RULES.filter(function(r){ return r.type === RULE_TYPE; }).slice().sort(function(a, b){
    if (a.status !== b.status) return a.status === 'active' ? -1 : 1;
    if (a.lang !== b.lang) return a.lang < b.lang ? -1 : 1;
    return a.max - b.max || (a.created < b.created ? 1 : -1);
  });
  var head = '<tr><th>'+esc(T('語言', 'Language'))+'</th><th>'+esc(T('滿堂數(堂)', 'Max Lessons'))+'</th><th>'+esc(T('有效月數(月)', 'Valid Months'))+'</th><th>'+esc(T('狀態', 'Status'))+'</th><th>'+esc(T('建立日期', 'Created'))+'</th><th>'+esc(T('封存日期', 'Archived'))+'</th><th>'+esc(T('操作人', 'Operator'))+'</th></tr>';
  document.getElementById('ruleTable').innerHTML = head + rows.map(function(r){
    var on = r.status === 'active';
    return '<tr class="'+(on?'':'archived')+'"><td>'+esc(r.lang)+'</td><td>'+r.max+'</td><td>'+r.months+'</td>' +
      '<td><span class="badge '+(on?'green':'gray')+'">'+esc(on ? T('使用中', 'Active') : T('已封存', 'Archived'))+'</span></td>' +
      '<td class="nowrap">'+esc(r.created)+'</td><td class="nowrap">'+esc(r.archived || '—')+'</td><td>'+personCell(STAFF[r.by])+'</td></tr>';
  }).join('');
  document.getElementById('ruleListHint').textContent = T(
    '系統依訂單購買堂數，找「滿堂數 ≥ 購買堂數」中最接近的規則；超過最大門檻時套用最大規則。課時到期日＝開課日＋有效月數。規則只影響建立之後的新訂單，不影響已建立的訂單；歷史規則保留為已封存紀錄。',
    'The system picks the closest rule whose max lessons ≥ purchased lessons; above the largest threshold, the largest rule applies. Expiry date = start date + valid months. Rules apply only to orders created afterwards; older rules stay as archived records.');
}
function switchRuleType(t){ RULE_TYPE = t; renderRules(); }
function addRule(){
  var lang = document.getElementById('ruleLang').value;
  var max = Number(document.getElementById('ruleMax').value);
  var months = Number(document.getElementById('ruleMonths').value);
  if (!max || max < 1 || Math.floor(max) !== max){ toast(T('請輸入滿堂數（1 以上的整數）', 'Enter max lessons (whole number, 1 or more)')); return; }
  if (!months || months < 1 || Math.floor(months) !== months){ toast(T('有效月數最低為 1 個月', 'Valid months must be at least 1')); return; }
  var today = todayStr(), archivedCount = 0;
  /* 規格 5-02：課程類型與滿堂數相同時，前一筆改為已封存（規格未提語言，待確認） */
  RULES.forEach(function(r){
    if (r.type === RULE_TYPE && r.max === max && r.status === 'active'){ r.status = 'archived'; r.archived = today; archivedCount++; }
  });
  RULES.push({type:RULE_TYPE, lang:lang, max:max, months:months, status:'active', created:today, archived:'', by:'hq'});
  document.getElementById('ruleMax').value = '';
  document.getElementById('ruleMonths').value = '';
  renderRules();
  toast(archivedCount ? T('已新增規則，原「滿 '+max+' 堂」規則已封存', 'Rule added; the previous '+max+'-lesson rule was archived') : T('已新增規則', 'Rule added'));
}

/* ---- 共用：頂欄通知／使用者選單／登出／toast（全站同一段） ---- */
/* 檢視階段：內容管理通知（校區主管發佈）與訂單逾期通知屬第二階段、銷售方案下架通知屬 1B */

  {t:'訂單 ORD-2026-0102 已逾期 5 天未收款', en:'Order ORD-2026-0102 is 5 days overdue for payment', time:'10 分鐘前', timeEn:'10 minutes ago', unread:true},

  {t:'內容管理：首頁 Hero 文案已由校區主管發佈', en:'Content Management: homepage hero copy has been published by the campus manager', time:'今天 09:12', timeEn:'Today 09:12', unread:false},
  {t:'老師黃志遠已切換為留職停薪', en:'Teacher 黃志遠 has switched to unpaid leave', time:'昨天', timeEn:'Yesterday', unread:false}
];
var NOTIFS = NOTIFS_ALL.filter(function(n){ var p = n.t.indexOf('內容管理') === 0 ? '2' : (n.t.indexOf('訂單') === 0 && n.t.indexOf('逾期') > 0) ? '2' : (n.t.indexOf('方案') >= 0 && n.t.indexOf('下架') > 0) ? '1B' : '1A'; return TLI_PHASE.atLeast(p); });
function renderNotifPanel(){
  var panel = document.getElementById('notifPanel');
  if (!panel) return;
  var unread = NOTIFS.filter(function(n){return n.unread;}).length;
  var dot = document.getElementById('tbDot');
  if (dot) dot.style.display = unread ? 'block' : 'none';
  panel.innerHTML = '<div class="tn-head"><span>'+(window.TLI_I18N?TLI_I18N.t('通知（'+unread+' 則未讀）','Notifications ('+unread+' unread)'):('通知（'+unread+' 則未讀）'))+'</span><a href="javascript:void(0)" onclick="markAllRead(event)">'+(window.TLI_I18N?TLI_I18N.t('全部標為已讀','Mark All as Read'):'全部標為已讀')+'</a></div>' +
    NOTIFS.map(function(n){ return '<div class="tb-notifitem'+(n.unread?' unread':'')+'">'+(window.TLI_I18N?TLI_I18N.t(n.t,n.en):n.t)+'<div class="tn-t">'+(window.TLI_I18N?TLI_I18N.t(n.time,n.timeEn):n.time)+'</div></div>'; }).join('');
}
function markAllRead(ev){
  if (ev) ev.stopPropagation();
  NOTIFS.forEach(function(n){ n.unread = false; });
  renderNotifPanel();
}
function toggleNotif(ev){
  ev.stopPropagation();
  closePanel('avatarMenu');
  var p = document.getElementById('notifPanel');
  p.classList.toggle('open');
  if (p.classList.contains('open')) renderNotifPanel();
}
function toggleAvatarMenu(ev){
  ev.stopPropagation();
  closePanel('notifPanel');
  document.getElementById('avatarMenu').classList.toggle('open');
}
function closePanel(id){
  var el = document.getElementById(id);
  if (el) el.classList.remove('open');
}
document.addEventListener('click', function(){ closePanel('notifPanel'); closePanel('avatarMenu'); });
function doLogout(){ location.href = 'a00_admin_login.html'; }
function toast(msg){
  var el = document.getElementById('toastEl');
  if (!el){
    el = document.createElement('div');
    el.id = 'toastEl';
    el.className = 'toast';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(function(){ el.classList.remove('show'); }, 2200);
}
renderNotifPanel();

<script>
function toggleNavGroup(ev, gid){
  ev.stopPropagation();
  var g = document.querySelector('#sidebar .navgroup[data-group="'+gid+'"]');
  if (!g) return;
  var collapsed = g.classList.toggle('collapsed');
  try{ localStorage.setItem('tliNavCollapse_'+gid, collapsed ? '1' : '0'); }catch(e){}
}
(function initNavGroups(){
  var activeLink = document.querySelector('#sidebar a.active');
  var activeGroup = activeLink ? activeLink.closest('.navgroup') : null;
  /* 20260927f：預設只展開目前頁面所在的群，其他群收合；若使用者手動展開/收合過某群，之後照該紀錄 */
  document.querySelectorAll('#sidebar .navgroup[data-group]').forEach(function(g){
    var gid = g.dataset.group, saved = null;
    try{ saved = localStorage.getItem('tliNavCollapse_'+gid); }catch(e){}
    if (saved === '1') g.classList.add('collapsed');
    else if (saved === '0') g.classList.remove('collapsed');
    else if (g !== activeGroup) g.classList.add('collapsed');
  });
  /* 目前頁所屬群組不可被收合到看不到 active 項目 */
  if (activeGroup) activeGroup.classList.remove('collapsed');
})();

/* ESC 關閉目前開啟中的 modal／選單 */
document.addEventListener('keydown', function(e){
  if (e.key !== 'Escape') return;
  closeRowMenu(); hideStuPop();
  if (document.getElementById('delModal').classList.contains('open')) closeDel();

  var m = document.getElementById('suMenu'); if (!m) return;
  ['notifPanel','avatarMenu'].forEach(function(id){ var e = document.getElementById(id); if (e) e.classList.remove('open'); });

};
document.addEventListener('click', function(ev){
  var m = document.getElementById('suMenu');
  if (m && !m.contains(ev.target)) m.classList.remove('open');
});
