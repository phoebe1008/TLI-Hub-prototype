<title>教材管理｜TLI Hub 管理後台</title>

<style>
:root{--navy:#1B4E8C;--navy-dark:#123a68;--orange:#E8792B;--teal:#0F9B79;
--g50:#F5F7FA;--g200:#E4E7EC;--g500:#667085;--g900:#101828;}
*{box-sizing:border-box;}
body{margin:0;font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,-apple-system,sans-serif;
background:var(--g50);color:var(--g900);font-size:14px;}
a{color:var(--navy);}
/* ---- 以下為與 a01/a04 對齊後移除的舊版版型殘留（.app max-width／舊 .sidebar／.content-col／舊 .topbar）；
     實際生效版型見本檔後段第二組樣式（與 a01/a04 逐值相同）與 #sidebar 覆寫區塊 ---- */
.pagehead{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:18px;gap:16px;}
.pagehead h1{font-size:20px;margin:0;}
.pagehead .desc{font-size:12.5px;color:var(--g500);margin-top:5px;line-height:1.6;}
.btn{display:inline-block;background:var(--navy);color:#fff;border:none;padding:8px 14px;
border-radius:6px;font-size:13px;cursor:pointer;text-decoration:none;white-space:nowrap;font-family:inherit;}
.btn.orange{background:var(--orange);}
.btn.ghost{background:#fff;border:1px solid var(--g200);color:var(--g900);}
.btn.sm{padding:5px 10px;font-size:12px;}
.btn:disabled,.btn.isdisabled{background:var(--g200)!important;color:var(--g500)!important;
cursor:not-allowed!important;}
.dm-inline{padding:4px 6px;border:1px solid var(--g200);border-radius:6px;font-size:12px;font-family:inherit;background:#fff;color:var(--g900);}
.formrow label .fieldlink{font-weight:400;font-size:11.5px;color:var(--navy);text-decoration:underline;margin-left:6px;}
.card{background:#fff;border:1px solid var(--g200);border-radius:12px;padding:18px;margin-bottom:16px;}
.card h2{font-size:15px;margin:0 0 12px;}
.detailpanel{background:#fff;border:1px solid var(--g200);border-radius:12px;padding:18px;margin-bottom:16px;box-shadow:0 1px 3px rgba(16,24,40,.06);}
.detailpanel h2{font-size:15px;margin:0 0 12px;}
.tablewrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;background:var(--g50);color:var(--g500);font-weight:600;padding:10px 12px;
border-bottom:1px solid var(--g200);white-space:nowrap;}
td{padding:10px 12px;border-bottom:1px solid var(--g200);white-space:nowrap;}
tr.rowlink{cursor:pointer;}
tr.rowlink:hover{background:#F8FAFD;}
.badge{display:inline-block;padding:2px 9px;border-radius:10px;font-size:11.5px;font-weight:600;white-space:nowrap;}
.badge.blue{background:#E7EEF8;color:var(--navy);}
.badge.green{background:#E4F5EE;color:var(--teal);}
.badge.orange{background:#FCE9DA;color:var(--orange);}
.badge.grey{background:var(--g200);color:var(--g500);}
.badge.red{background:#FBE7E7;color:#C0392B;}
.modal-mask{display:none;position:fixed;inset:0;background:rgba(16,24,40,.42);z-index:150;
align-items:center;justify-content:center;}
.modal-mask.open{display:flex;}
.modal{background:#fff;border-radius:10px;width:460px;max-width:90vw;max-height:85vh;
overflow:auto;padding:22px;}
.modal.wide{width:620px;}
.modal.xwide{width:780px;}
.modal .sec{font-size:13.5px;font-weight:700;margin:18px 0 10px;padding-top:14px;border-top:1px solid var(--g200);}
.modal .sec:first-of-type{border-top:none;margin-top:6px;padding-top:0;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;}
.filterbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px;}
.filterbar input,.filterbar select{padding:7px 10px;border:1px solid var(--g200);border-radius:6px;font-size:13px;font-family:inherit;background:#fff;}
.filterbar input[type=text]{width:240px;}
.formrow label.chkline{display:flex;align-items:center;gap:6px;font-size:13.5px;color:var(--g900);padding:7px 0;margin:0;}
.formrow label.chkline input{width:auto;padding:0;margin:0;}
.formrow label:has(+ .req){display:inline-block;margin-right:3px;}
@media(max-width:700px){.grid3{grid-template-columns:1fr;}}
.modal h3{margin-top:0;font-size:16px;}
.formrow{margin-bottom:13px;}
.formrow label{display:block;font-size:12.5px;color:var(--g500);margin-bottom:4px;}
.req{color:#C00000;margin-left:2px;}
.formrow input,.formrow select,.formrow textarea{width:100%;padding:7px 10px;border:1px solid var(--g200);
border-radius:6px;font-size:13px;box-sizing:border-box;font-family:inherit;}
.formrow .static{padding:7px 0;font-size:13.5px;}
.note{font-size:12px;color:#7a5b1f;background:#FFF8EE;border:1px solid #F3DFB8;padding:9px 11px;
border-radius:6px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.kv{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--g200);font-size:13px;}
.kv span:first-child{color:var(--g500);}
.small{font-size:12px;color:var(--g500);}
.hint{font-size:11.5px;color:var(--g500);margin-top:3px;}
/* ---- 使用資源：可勾選清單（20260929fix4，與 a03_product_detail.html 的「使用教材」抽屜同一組樣式，取代舊版點不動的 select multiple） ---- */
.pickListWrap{max-height:200px;overflow-y:auto;border:1px solid var(--g200);border-radius:8px;padding:2px 10px;}
.pickrow{display:flex;align-items:center;gap:8px;padding:7px 2px;border-bottom:1px dashed var(--g200);font-size:13px;}
.pickrow:last-child{border-bottom:none;}
.pickrow input[type=checkbox]{width:auto;flex:0 0 auto;padding:0;border:none;}
.pickrow .pname{flex:1;cursor:pointer;}
.pickPinned{display:none;background:var(--g50);border:1px solid var(--g200);border-radius:8px;padding:10px 12px;margin-bottom:10px;}
.pickChips{display:flex;flex-wrap:wrap;gap:6px;}
.pickChip{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--g200);border-radius:16px;padding:3px 6px 3px 10px;font-size:12px;color:var(--g900);}
.pickChip button{background:var(--g200);border:none;border-radius:50%;width:16px;height:16px;line-height:1;cursor:pointer;color:var(--g500);font-size:11px;padding:0;}
.pickChip button:hover{background:#C0392B;color:#fff;}
input[readonly].ro-input{background:var(--g50);color:var(--g500);cursor:not-allowed;}
.tree{font-size:13px;}
.tree .all-reset{font-weight:600;color:var(--g900);padding:8px 10px;border-radius:6px;cursor:pointer;margin-bottom:6px;display:block;}
.tree .all-reset:hover{background:var(--g50);}
.tree .all-reset.active{background:#E7EEF8;color:var(--navy);}
.tree .line{margin-bottom:2px;}
.tree .linerow{display:flex;align-items:center;gap:4px;border-radius:6px;}
.tree .linerow:hover{background:var(--g50);}
.tree .linerow.active{background:#E7EEF8;color:var(--navy);}
.tree .linehead{flex:1;display:flex;align-items:center;gap:6px;padding:7px 4px 7px 8px;cursor:pointer;font-weight:600;color:var(--g900);}
.tree .linerow.active .linehead{color:var(--navy);}
.tree .caret{display:inline-block;width:10px;font-size:10px;color:var(--g500);transition:transform .15s;cursor:pointer;}
.tree .line.open>.linerow .caret{transform:rotate(90deg);}
.tree .systems{margin-left:16px;display:none;}
.tree .line.open .systems{display:block;}
.tree .sysrow{display:flex;align-items:center;gap:4px;border-radius:6px;}
.tree .sysrow:hover{background:var(--g50);}
.tree .sysrow.active{background:#E7EEF8;}
.tree .sysitem{flex:1;display:flex;align-items:center;gap:5px;padding:6px 4px 6px 6px;font-size:12.5px;color:var(--g500);cursor:pointer;}
.tree .sysrow.active .sysitem{color:var(--navy);font-weight:600;}
.tree .syschildren{margin-left:18px;display:none;}
.tree .system.open .syschildren{display:block;}
.tree .syschild{display:block;padding:5px 6px;font-size:12px;color:var(--g500);cursor:pointer;border-radius:5px;}
.tree .syschild:hover{background:var(--g50);}
.tree .syschild.active{background:#E7EEF8;color:var(--navy);font-weight:600;}
.tree .allsub{display:block;padding:6px 6px;font-size:12.5px;color:var(--g500);cursor:pointer;border-radius:5px;}
.tree .allsub:hover{background:var(--g50);}
.tree .allsub.active{background:#E7EEF8;color:var(--navy);font-weight:600;}
.tree .status-off{opacity:.5;}
.moremenu-wrap{position:relative;}
.moredot{background:none;border:none;color:var(--g500);cursor:pointer;font-size:14px;padding:3px 6px;font-family:inherit;line-height:1;}
.moredot:hover{color:var(--navy);}
.moremenu{display:none;position:absolute;right:0;top:22px;background:#fff;border:1px solid var(--g200);
border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.12);z-index:50;min-width:130px;padding:4px;}
.moremenu.open{display:block;}
.moremenu button{display:block;width:100%;text-align:left;background:none;border:none;padding:7px 10px;
font-size:12.5px;color:var(--g900);cursor:pointer;border-radius:5px;font-family:inherit;}
.moremenu button:hover{background:var(--g50);}
.wizard-steps{display:flex;margin-bottom:18px;}
.wizard-steps .ws{flex:1;text-align:center;font-size:11.5px;color:var(--g500);padding-bottom:8px;border-bottom:3px solid var(--g200);}
.wizard-steps .ws.active{color:var(--navy);font-weight:600;border-bottom-color:var(--navy);}
.wizard-steps .ws.done{color:var(--teal);border-bottom-color:var(--teal);}
.wizstep{display:none;}
.wizstep.active{display:block;}
.droparea{border:2px dashed var(--g200);border-radius:8px;padding:30px;text-align:center;color:var(--g500);font-size:13px;}
.maprow{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:center;padding:6px 0;font-size:13px;}
.switch{position:relative;display:inline-block;width:38px;height:22px;vertical-align:middle;}
.switch input{opacity:0;width:0;height:0;position:absolute;}
.switch .slider{position:absolute;inset:0;background:var(--g200);border-radius:22px;cursor:pointer;transition:.15s;}
.switch .slider:before{content:'';position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.15s;}
.switch input:checked+.slider{background:var(--teal);}
.switch input:checked+.slider:before{transform:translateX(16px);}

.drawer.open{transform:translateX(0);}

.drawer-close:hover{color:var(--g900);}
.drawer-body{flex:1;overflow-y:auto;padding:16px 20px 40px;}

.dropzone.filled{border-color:var(--teal);color:var(--teal);background:#F5FBF9;}

<script>
function toggleSidebar(){
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sidebarBackdrop').classList.toggle('open');
}
function closeSidebar(){
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarBackdrop').classList.remove('open');
}
/* ================= 共用：頂欄通知／使用者選單／登出／toast（全站同一段） ================= */
/* 檢視階段：內容管理通知（校區主管發佈）與訂單逾期通知屬第二階段、銷售方案下架通知屬 1B */
var NOTIFS_ALL = [
  {t:'訂單 ORD-2026-0102 已逾期 5 天未收款', en:'Order ORD-2026-0102 is 5 days overdue for payment', time:'10 分鐘前', timeEn:'10 minutes ago', unread:true},
  {t:'銷售方案「學期班 Lv.5–8 一期方案」即將於 1/31 下架', en:'Sales plan \u201c學期班 Lv.5\u20138 一期方案\u201d will be delisted on 1/31', time:'1 小時前', timeEn:'1 hour ago', unread:true},
  {t:'內容管理：首頁 Hero 文案已由校區主管發佈', en:'Content Management: homepage hero copy has been published by the campus manager', time:'今天 09:12', timeEn:'Today 09:12', unread:false},
  {t:'老師黃志遠已切換為留職停薪', en:'Teacher 黃志遠 has switched to unpaid leave', time:'昨天', timeEn:'Yesterday', unread:false}
];
var NOTIFS = NOTIFS_ALL.filter(function(n){ var p = n.t.indexOf('內容管理') === 0 ? '2' : (n.t.indexOf('訂單') === 0 && n.t.indexOf('逾期') > 0) ? '2' : (n.t.indexOf('方案') >= 0 && n.t.indexOf('下架') > 0) ? '1B' : '1A'; return TLI_PHASE.atLeast(p); });
function renderNotifPanel(){
  var panel = document.getElementById('notifPanel');
  if (!panel) return;
  var unread = NOTIFS.filter(function(n){return n.unread;}).length;
  var dot = document.getElementById('tbDot');
  if (dot) dot.style.display = unread ? 'block' : 'none';
  panel.innerHTML = '<div class="tn-head"><span>'+(window.TLI_I18N?TLI_I18N.t('通知（'+unread+' 則未讀）','Notifications ('+unread+' unread)'):('通知（'+unread+' 則未讀）'))+'</span><a href="javascript:void(0)" onclick="markAllRead(event)">'+(window.TLI_I18N?TLI_I18N.t('全部標為已讀','Mark All as Read'):'全部標為已讀')+'</a></div>' +
    NOTIFS.map(function(n){ return '<div class="tb-notifitem'+(n.unread?' unread':'')+'">'+(window.TLI_I18N?TLI_I18N.t(n.t,n.en):n.t)+'<div class="tn-t">'+(window.TLI_I18N?TLI_I18N.t(n.time,n.timeEn):n.time)+'</div></div>'; }).join('');
}
function markAllRead(ev){
  if (ev) ev.stopPropagation();
  NOTIFS.forEach(function(n){ n.unread = false; });
  renderNotifPanel();
}
function toggleNotif(ev){
  ev.stopPropagation();

function toast(msg){
  var el = document.getElementById('toastEl');
  if (!el){
    el = document.createElement('div');
    el.id = 'toastEl';
    el.className = 'toast';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(function(){ el.classList.remove('show'); }, 2200);
}
renderNotifPanel();

/* ================= 教材管理（一階段 A）=================
   依客戶 Connect 2.0 規格書 4.8-教材管理 與「教材管理編輯原型」。
   一筆教材＝一本書：多語標題（繁中、英文）＋檔案版本矩陣（字體 × 輔助語言，每格引用一個教材素材 PDF）＋全版本共用的附屬音檔。
   資料在共用主檔 TLI_MASTERS.materialBooks（欄位說明見 _shared_masters.js 第 22 項），存檔寫 localStorage。
   教材素材、音頻素材屬資源庫（a18）；此頁的挑選庫是示範用，正式串接時改讀 a18 教材庫與音頻庫。 */
var T = function(zh, en){ return TLI_I18N.t(zh, en); };
var BOOKS = TLI_MASTERS.materialBooks;

/* ---- 示範用資源庫（客戶原型的素材檔名；dur：'mm:ss'＝已解析、'parsing'＝解析中、null＝無法取得） ---- */
var LIB_PDF = [
  {n:'NPC1_TC_EN.pdf'}, {n:'NPC1_TC_JP.pdf'}, {n:'NPC1_SC_EN.pdf'}, {n:'NPC1_SC_JP.pdf'},
  {n:'NPC2_TC_EN.pdf'}, {n:'發音專章_TC.pdf'}
];
var LIB_AUDIO = [
  {n:'NPC1_A_0102.mp3', d:'00:27'}, {n:'NPC1_A_0106.mp3', d:'00:28'}, {n:'NPC1_A_0107.mp3', d:'01:04'},
  {n:'NPC1_A_0201.mp3', d:'00:41'}, {n:'NPC1_A_0204.mp3', d:'01:52'}, {n:'NPC1_A_0301.mp3', d:'02:10'},
  {n:'NPC1_A_0305.mp3', d:'00:52'}, {n:'NPC1_A_0402.mp3', d:'parsing'}, {n:'NPC1_A_0501.mp3', d:null}
];
/* 新增素材時的內容標籤選項（必填至少一個）：先沿用 a18 示範資料出現過的標籤；客戶「4.2 標籤系統」我們尚無資料，待確認 */
var ASSET_TAGS = (window.TLI_MASTERS && TLI_MASTERS.activeContentTagNames) ? TLI_MASTERS.activeContentTagNames() : ['情境圖','初級','詞彙卡','文化','中級','會話講解','聽力','朗讀'];   // 詞彙來自共用主檔（a17「標籤管理」維護）

var SCRIPTS = ['tc','sc'], AUXS = ['en','ja'];
function scriptLabel(s){ return s === 'tc' ? T('繁體','Traditional') : T('簡體','Simplified'); }
function auxLabel(x){ return x === 'en' ? T('EN 輔助','EN support') : T('JP 輔助','JP support'); }
function verKey(s, x){ return s + '-' + x; }
function verLabelShort(k){ var p = k.split('-'); return (p[0] === 'tc' ? T('繁','繁') : T('簡','簡')) + '·' + (p[1] === 'ja' ? 'JP' : p[1].toUpperCase()); }   /* 顯示為 JP（與 auxLabel 一致）；資料鍵維持 'ja' */
function verLabelFull(k){ var p = k.split('-'); return scriptLabel(p[0]) + ' · ' + auxLabel(p[1]); }
function escHtml(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escAttr(s){ return escHtml(s).replace(/"/g,'&quot;'); }

var qs = location.search;
var qId = (/[?&]id=([^&]+)/.exec(qs) || [])[1];
var qNew = /[?&]new=1/.test(qs);
var draft = null, snapshot = '', isNew = false, curLoc = 'zh';
var LF = { q:'', st:'' };

/* ---------- 共用工具 ---------- */
function bookTitle(b){ return b.titleZh || b.titleEn || T('（未命名）','(Untitled)'); }
function versionCount(b){ return Object.keys(b.versions || {}).length; }
function usageOf(b){
  return TLI_MASTERS.products.filter(function(p){
    if (p.materialBookIds) return p.materialBookIds.indexOf(b.id) > -1;
    return (p.materials || []).indexOf(b.titleZh) > -1;
  });
}
function catName(id){ var c = TLI_MASTERS.productCategories.find(function(x){ return x.id === id; }); return c ? c.name : '—'; }
function statusBadge(s){ return s === '啟用' ? '<span class="badge green">' + T('啟用','Enabled') + '</span>' : '<span class="badge grey">' + T('停用','Disabled') + '</span>'; }
function durInfo(assetName){
  var a = LIB_AUDIO.find(function(x){ return x.n === assetName; });
  if (!a || a.d == null) return {text:T('無法取得','Unavailable'), warn:true, tip:T('外部來源或解析失敗，無法取得時長，請至資源庫確認素材。','Duration could not be obtained (external source or parse failure); check the asset in the Resource Library.')};
  if (a.d === 'parsing') return {text:T('解析中','Parsing'), warn:false, tip:''};
  return {text:a.d, warn:false, tip:''};
}
function flash(where, title, html){
  var el = document.getElementById(where);
  if (!el) return;
  el.innerHTML = '<div class="flashbox"><button class="x" aria-label="' + T('關閉','Close') + '" onclick="this.parentNode.parentNode.innerHTML=\'\'">×</button><h4>' + title + '</h4>' + html + '</div>';
}

/* ---------- 共用確認彈窗（破壞型：確認＋取消＋右上 ✕；通知型：確認＋右上 ✕） ---------- */
var uiOnOk = null;
function openConfirm(o){
  document.getElementById('uiTitle').textContent = o.title || '';
  document.getElementById('uiBody').innerHTML = o.body || '';
  var ok = document.getElementById('uiOk');
  ok.textContent = o.okText || T('確認','OK');
  ok.className = 'btn' + (o.kind === 'destructive' ? ' orange' : '');
  document.getElementById('uiCancel').style.display = o.kind === 'notice' ? 'none' : '';
  uiOnOk = o.onOk || null;
  document.getElementById('uiMask').classList.add('open');
}
function closeConfirm(){ document.getElementById('uiMask').classList.remove('open'); uiOnOk = null; }
function confirmOk(){ var fn = uiOnOk; closeConfirm(); if (fn) fn(); }

/* ================= 列表 ================= */
function filteredBooks(){
  var q = LF.q.trim().toLowerCase();
  return BOOKS.filter(function(b){
    if (LF.st && b.status !== LF.st) return false;
    if (q && ((b.titleZh || '') + ' ' + (b.titleEn || '')).toLowerCase().indexOf(q) < 0) return false;
    return true;
  });
}
function renderListTable(){
  var list = filteredBooks();
  var cnt = document.getElementById('listCount');
  if (cnt) cnt.textContent = T('共 ' + list.length + ' 本', list.length + ' book(s)');
  var el = document.getElementById('listTable');
  if (!el) return;
  if (!list.length){ el.innerHTML = '<div class="note">' + T('沒有符合條件的教材。','No materials match the filters.') + '</div>'; return; }
  var rows = list.map(function(b){
    var u = usageOf(b).length;
    return '<tr class="rowlink" onclick="location.href=\'a25_materials.html?id=' + b.id + '\'"><td>' + escHtml(b.titleZh) + '</td><td>' + (b.titleEn ? escHtml(b.titleEn) : '<span class="small">—</span>') + '</td>' +
      '<td>' + versionCount(b) + ' / 4</td><td>' + T((b.audios || []).length + ' 筆', (b.audios || []).length + ' audio') + '</td>' +
      '<td>' + (u ? T(u + ' 個產品', u + ' product(s)') : '<span class="small">' + T('未被引用','Not referenced') + '</span>') + '</td><td>' + statusBadge(b.status) + '</td>' +
      '<td><a class="btn ghost sm" href="a25_materials.html?id=' + b.id + '" onclick="event.stopPropagation()">' + T('編輯','Edit') + '</a> ' +
      '<button class="btn ghost sm" onclick="event.stopPropagation();toggleBookStatus(\'' + b.id + '\')">' + T(b.status === '啟用' ? '停用' : '啟用', b.status === '啟用' ? 'Disable' : 'Enable') + '</button></td></tr>';
  }).join('');
  el.innerHTML = '<div class="tablewrap"><table><tr><th>' + T('標題（繁中）','Title (Traditional Chinese)') + '</th><th>' + T('標題（English）','Title (English)') + '</th><th>' + T('檔案版本','File versions') + '</th><th>' + T('附屬音檔','Audio') + '</th><th>' + T('被引用','Referenced by') + '</th><th>' + T('狀態','Status') + '</th><th>' + T('操作','Actions') + '</th></tr>' + rows + '</table></div>';
}
function clearListFilter(){ LF = {q:'', st:''}; renderPage(); }
function renderList(){
  document.getElementById('headActions').innerHTML = '<a class="btn" href="a25_materials.html?new=1">' + T('＋ 新增教材','+ Add Material') + '</a>';
  document.getElementById('pgDesc').textContent = T('教材是獨立實體：一筆教材＝一本書，包含多語標題、檔案版本與共用的附屬音檔，可被多個產品引用。檔案本身（教材素材、音頻素材）在資源庫。','A material is an entity of its own: one book with multilingual titles, file versions and shared audio, and it can be referenced by multiple products. The files themselves (material and audio assets) live in the Resource Library.');
  document.getElementById('pageBody').innerHTML = '<div class="card">' +
    '<div class="filterbar"><input type="text" id="lf_q" value="' + escAttr(LF.q) + '" placeholder="' + T('搜尋教材名稱','Search material title') + '" oninput="LF.q=this.value;renderListTable()">' +
    '<select id="lf_st" onchange="LF.st=this.value;renderListTable()" aria-label="' + T('狀態','Status') + '"><option value="">' + T('全部狀態','All statuses') + '</option><option value="啟用"' + (LF.st === '啟用' ? ' selected' : '') + '>' + T('啟用','Enabled') + '</option><option value="停用"' + (LF.st === '停用' ? ' selected' : '') + '>' + T('停用','Disabled') + '</option></select>' +
    '<a href="javascript:void(0)" onclick="clearListFilter()" class="small" style="color:var(--navy);text-decoration:underline">' + T('清除篩選','Clear filters') + '</a>' +
    '<span class="small" id="listCount" style="margin-left:auto;color:var(--g500)"></span></div><div id="listTable"></div></div>';
  renderListTable();
}
/* 列表上的停用／啟用：被引用時警示後允許 */
function toggleBookStatus(id){
  var b = BOOKS.find(function(x){ return x.id === id; });
  if (!b) return;
  var to = b.status === '啟用' ? '停用' : '啟用';
  var apply = function(){
    b.status = to; TLI_MASTERS.saveMaterialBooks();
    toast(T('已將教材「' + bookTitle(b) + '」設為' + to, 'Material "' + bookTitle(b) + '" set to ' + (to === '啟用' ? 'Enabled' : 'Disabled')));
    renderListTable();
  };
  if (to === '停用' && usageOf(b).length) confirmDisable(b, apply); else apply();
}
function confirmDisable(b, onOk){
  var used = usageOf(b);
  openConfirm({kind:'destructive', title:T('停用「' + bookTitle(b) + '」？','Disable "' + bookTitle(b) + '"?'), okText:T('仍要停用','Disable anyway'),
    body:'<p style="margin:0 0 8px;font-size:13.5px">' + T('這本教材目前被下列產品引用：','This material is currently referenced by:') + '</p><ul style="margin:0 0 8px;padding-left:19px;font-size:13.5px">' +
      used.map(function(p){ return '<li>' + escHtml(p.name) + '</li>'; }).join('') + '</ul>' +
      '<p style="margin:0;font-size:13px;color:var(--g500)">' + T('停用後這些產品的教材資源將無法取用；資料完整保留，後台仍可查詢與編輯。','After disabling, the material resources of these products can no longer be accessed; data is fully kept and remains viewable and editable in the back office.') + '</p>',
    onOk:onOk});
}

/* ================= 編輯頁 ================= */
function openEditor(){
  if (qId){
    var b = BOOKS.find(function(x){ return x.id === qId; });
    if (!b){ toast(T('找不到這筆教材','Material not found')); return false; }
    draft = JSON.parse(JSON.stringify(b)); isNew = false;
  } else {
    draft = {id:'', titleZh:'', titleEn:'', status:'啟用', versions:{}, audios:[]}; isNew = true;
  }
  snapshot = JSON.stringify(draft);
  return true;
}
function isDirty(){ return JSON.stringify(draft) !== snapshot; }
function backToList(){
  if (!isDirty()){ location.href = 'a25_materials.html'; return; }
  openConfirm({kind:'destructive', title:T('放棄變更？','Discard changes?'), okText:T('放棄','Discard'),
    body:'<p style="margin:0;font-size:13.5px">' + T('尚未儲存的變更會消失。','Unsaved changes will be lost.') + '</p>', onOk:function(){ location.href = 'a25_materials.html'; }});
}
function renderEditor(){
  document.getElementById('pgDesc').textContent = '';
  document.getElementById('headActions').innerHTML = '<button class="btn ghost" onclick="backToList()">' + T('取消','Cancel') + '</button><button class="btn" onclick="saveBook()">' + T('儲存','Save') + '</button>';
  document.getElementById('pageBody').innerHTML =
    '<div class="crumb"><a href="javascript:void(0)" onclick="backToList()">← ' + T('教材管理','Materials') + '</a> › ' + escHtml(isNew ? T('新增教材','Add Material') : bookTitle(draft)) + '</div>' +
    '<div class="card" id="secBasic"></div><div class="card" id="secVer"></div><div class="card" id="secAudio"></div><div class="card" id="secUsed"></div>';
  renderBasic(); renderMatrix(); renderAudio(); renderUsed();
}
/* ---- 1 基本資訊 ---- */
function renderBasic(){
  var zh = curLoc === 'zh';
  document.getElementById('secBasic').innerHTML =
    '<div class="sechead"><h2>' + T('1　基本資訊','1  Basic Information') + '</h2></div>' +
    '<p class="secwhy">' + T('標題依資料語系分別維護：繁體中文與英文。簡體不是資料語系，簡體版是檔案的字體版本（見下方檔案版本）。','Titles are kept per data locale: Traditional Chinese and English. Simplified Chinese is not a data locale; it is a font version of the file (see File Versions below).') + '</p>' +
    '<div class="loctabs"><button class="' + (zh ? 'on' : '') + '" onclick="setLoc(\'zh\')">' + T('繁體中文','Traditional Chinese') + '</button><button class="' + (!zh ? 'on' : '') + '" onclick="setLoc(\'en\')">English <span title="' + T('回退語系','Fallback locale') + '" style="color:var(--navy);font-size:12px">★</span></button></div>' +
    '<div class="formrow"><label>' + T('標題','Title') + '</label><span class="req">*</span>' +
    '<input type="text" id="bk_title" value="' + escAttr(zh ? draft.titleZh : draft.titleEn) + '" oninput="onTitleInput(this.value)">' +
    (zh ? '' : '<div class="refbox"><div class="rl">' + T('對照語系：繁體中文（唯讀）','Reference locale: Traditional Chinese (read-only)') + '</div><div class="rt' + (draft.titleZh ? '' : ' empty') + '">' + (draft.titleZh ? escHtml(draft.titleZh) : T('（尚未填寫）','(not filled in)')) + '</div></div>') + '</div>' +
    '<div class="formrow"><label>' + T('狀態','Status') + '</label><select id="bk_status" style="max-width:160px" onchange="draft.status=this.value"><option value="啟用"' + (draft.status === '啟用' ? ' selected' : '') + '>' + T('啟用','Enabled') + '</option><option value="停用"' + (draft.status === '停用' ? ' selected' : '') + '>' + T('停用','Disabled') + '</option></select>' +
    '<div class="hint" style="font-size:12.5px;color:var(--g500)">' + T('停用後前台取用不到，後台仍可查詢與編輯。用於不再使用但需保留的教材。','When disabled, the front end can no longer access it, while the back office can still view and edit it. Use it for materials that are no longer in use but must be kept.') + '</div></div>';
}
/* 編輯頁的「停用此教材」：直接生效並存檔（只改狀態，其他未儲存的修改維持草稿）；被引用時警示後允許 */
function toggleStatusInEditor(){
  var orig = BOOKS.find(function(x){ return x.id === draft.id; });
  if (!orig) return;
  var to = orig.status === '啟用' ? '停用' : '啟用';
  var apply = function(){
    orig.status = to; draft.status = to;
    var snap = JSON.parse(snapshot); snap.status = to; snapshot = JSON.stringify(snap);
    TLI_MASTERS.saveMaterialBooks();
    renderEditor();
    toast(T('已將教材「' + bookTitle(orig) + '」設為' + to, 'Material "' + bookTitle(orig) + '" set to ' + (to === '啟用' ? 'Enabled' : 'Disabled')));
  };
  if (to === '停用' && usageOf(orig).length) confirmDisable(orig, apply); else apply();
}
function setLoc(l){ curLoc = l; renderBasic(); renderAudio(); }
function onTitleInput(v){ if (curLoc === 'zh') draft.titleZh = v; else draft.titleEn = v; }

/* ---- 2 檔案版本（矩陣） ---- */
function renderMatrix(){
  var h = '<div class="sechead"><h2>' + T('2　檔案版本','2  File Versions') + '</h2></div>' +
    '<p class="secwhy">' + T('版本＝字體（繁／簡）×輔助語言（EN／JP）。每格引用一筆教材素材（資源庫的教材庫），可就地新增。不強制所有組合都要有。','A version = font (Traditional / Simplified) × support language (EN / JP). Each cell references one material asset from the Resource Library; you can add a new one on the spot. Not every combination is required.') + '</p>' +
    '<div id="flashVer"></div><div class="matrix"><div></div>' + AUXS.map(function(x){ return '<div class="mhead">' + auxLabel(x) + '</div>'; }).join('');
  SCRIPTS.forEach(function(s){
    h += '<div class="mside">' + scriptLabel(s) + '</div>';
    AUXS.forEach(function(x){
      var k = verKey(s, x), asset = draft.versions[k];
      if (asset){
        h += '<div class="mcell"><span class="fn">' + escHtml(asset) + '</span><span class="mfoot"><span class="okt">✓ ' + T('已提供','Provided') + '</span><span style="flex:1"></span>' +
          '<button class="iconbtn" title="' + T('更換素材','Replace asset') + '" onclick="replaceVersion(\'' + k + '\')">⇄</button>' +
          '<button class="iconbtn warn" title="' + T('移除引用','Remove reference') + '" onclick="removeVersion(\'' + k + '\')">🗑</button></span></div>';
      } else {
        h += '<div class="mcell miss"><span class="small" style="color:var(--g500)">' + T('未提供','Not provided') + '</span><button class="btn ghost sm" onclick="addVersion(\'' + k + '\')">' + T('＋ 加入','+ Add') + '</button></div>';
      }
    });
  });
  h += '</div><div class="hint" style="margin-top:12px">' + T('虛線格＝未提供；已提供的格子可更換素材或移除引用。移除的是關聯，不是教材庫裡的檔案。','Dashed cell = not provided; provided cells can be replaced or unlinked. Removing deletes the link only, never the file in the library.') + '</div>';
  document.getElementById('secVer').innerHTML = h;
}
function addVersion(k){
  openPicker('pdf', T('為 [' + verLabelFull(k) + '] 挑選教材素材','Pick a material asset for [' + verLabelFull(k) + ']'), function(a){
    draft.versions[k] = a.n;
    renderMatrix(); renderAudio();
    flash('flashVer', T('已加入版本 [' + verLabelFull(k) + ']','Added version [' + verLabelFull(k) + ']'), '<p style="margin:0">' + T('引用 ','References ') + '<code>' + escHtml(a.n) + '</code>。' + T('附屬音檔表格多了一欄頁碼，需填入這個版本的頁碼。','The audio table now has a page column for this version; fill in its page numbers.') + '</p>');
    if ((draft.audios || []).length && Object.keys(draft.versions).length > 1) openCopyPages([k]);
  }, false);
}
function replaceVersion(k){
  openPicker('pdf', T('更換 [' + verLabelFull(k) + '] 的教材素材','Replace the material asset of [' + verLabelFull(k) + ']'), function(a){
    draft.versions[k] = a.n; renderMatrix();
    flash('flashVer', T('已更換引用','Reference replaced'), '<p style="margin:0">[' + verLabelFull(k) + '] ' + T('現在引用 ','now references ') + '<code>' + escHtml(a.n) + '</code>。' + T('教材庫裡的檔案未被更動。','The file in the library is unchanged.') + '</p>');
  }, false);
}
function removeVersion(k){
  var n = (draft.audios || []).filter(function(a){ return a.pages && a.pages[k] != null && a.pages[k] !== ''; }).length;
  openConfirm({kind:'destructive', title:T('移除版本 [' + verLabelFull(k) + ']？','Remove version [' + verLabelFull(k) + ']?'), okText:T('移除','Remove'),
    body:'<ul style="margin:0;padding-left:19px;font-size:13.5px;line-height:1.7"><li>' + T('移除的是關聯，教材庫裡的 ','This removes the link only; ') + '<code>' + escHtml(draft.versions[k]) + '</code>' + T(' 仍在。',' stays in the library.') + '</li>' +
      '<li><b>' + T('該版本的 ' + n + ' 筆起始頁碼將一併刪除','The ' + n + ' start page number(s) of this version will be deleted too') + '</b>' + T('，音檔表格會少一欄。','; the audio table loses a column.') + '</li>' +
      '<li>' + T('重新加回版本不會救回頁碼。','Adding the version back does not restore the page numbers.') + '</li></ul>',
    onOk:function(){
      var old = draft.versions[k];
      (draft.audios || []).forEach(function(a){ if (a.pages) delete a.pages[k]; });
      delete draft.versions[k];
      renderMatrix(); renderAudio();
      flash('flashVer', T('已移除版本 [' + verLabelFull(k) + ']','Removed version [' + verLabelFull(k) + ']'), '<p style="margin:0">' + T('連同 ' + n + ' 筆起始頁碼一併刪除。','Together with ' + n + ' start page number(s).') + '</p>');
    }});
}

/* ---- 3 附屬音檔 ---- */
function sortedVersionKeys(){
  var out = [];
  SCRIPTS.forEach(function(s){ AUXS.forEach(function(x){ var k = verKey(s, x); if (draft.versions[k]) out.push(k); }); });
  return out;
}
function renderAudio(){
  var vks = sortedVersionKeys(), n = vks.length;
  var cols = '28px minmax(160px,1fr) 80px ' + (n ? 'repeat(' + n + ',72px) ' : '') + '78px 150px';
  var head = (n ? '<span style="grid-column:span 3"></span><span class="grp" style="grid-column:span ' + n + '">' + T('起始頁碼（各版本分開記）','Start page (kept per version)') + '</span><span style="grid-column:span 2"></span>' : '') +
    '<span>#</span><span>' + T('標題（依語系）','Title (per locale)') + '</span><span>' + T('書本課次','Lesson') + '</span>' +
    vks.map(function(k){ return '<span title="' + escAttr(T('起始頁碼 · ','Start page · ') + verLabelFull(k)) + '">' + verLabelShort(k) + '</span>'; }).join('') +
    '<span>' + T('時長','Duration') + '</span><span>' + T('操作','Actions') + '</span>';
  var rows = (draft.audios || []).map(function(a, i){
    var d = durInfo(a.asset);
    return '<div class="arow"><div class="aline" style="grid-template-columns:' + cols + '">' +
      '<span class="small">' + (i + 1) + '</span>' +
      '<input type="text" value="' + escAttr(curLoc === 'zh' ? a.titleZh : a.titleEn) + '" aria-label="' + T('音檔標題','Audio title') + '" oninput="onAudioTitle(' + i + ',this.value)">' +
      '<input type="number" min="1" value="' + escAttr(a.lesson == null ? '' : a.lesson) + '" aria-label="' + T('書本課次','Lesson') + '" oninput="onAudioLesson(' + i + ',this.value)">' +
      vks.map(function(k){ return '<input type="number" min="1" value="' + escAttr(a.pages && a.pages[k] != null ? a.pages[k] : '') + '" aria-label="' + escAttr(T('起始頁碼 ','Start page ') + verLabelFull(k)) + '" oninput="onAudioPage(' + i + ',\'' + k + '\',this.value)">'; }).join('') +
      '<span class="dur' + (d.warn ? ' warn' : '') + '" title="' + escAttr(d.tip) + '">' + d.text + '</span>' +
      '<span style="display:flex;gap:4px"><button class="iconbtn" title="' + T('上移','Move up') + '"' + (i === 0 ? ' disabled' : '') + ' onclick="moveAudio(' + i + ',-1)">↑</button>' +
      '<button class="iconbtn" title="' + T('下移','Move down') + '"' + (i === draft.audios.length - 1 ? ' disabled' : '') + ' onclick="moveAudio(' + i + ',1)">↓</button>' +
      '<button class="iconbtn" title="' + T('更換素材','Replace asset') + '" onclick="replaceAudio(' + i + ')">⇄</button>' +
      '<button class="iconbtn warn" title="' + T('移除','Remove') + '" onclick="removeAudio(' + i + ')">🗑</button></span></div>' +
      '<div class="src">' + T('素材：','Asset: ') + escHtml(a.asset) + '　<span style="color:var(--g500);font-family:inherit">' + T('（名稱由資源庫維護，時長由此帶出）','(name is maintained in the library; duration comes from it)') + '</span></div></div>';
  }).join('');
  document.getElementById('secAudio').innerHTML =
    '<div class="sechead"><h2>' + T('3　附屬音檔','3  Audio') + '</h2><span class="small" style="color:var(--g500)">' + T((draft.audios || []).length + ' 筆', (draft.audios || []).length + ' item(s)') + '</span></div>' +
    '<p class="secwhy">' + T('全版本共用同一組音檔，但頁碼各版本分開記。排序依「書本課次」，不依頁碼；順序即前台播放清單順序。','All versions share one set of audio, but page numbers are kept per version. Sorting follows the book lesson, not page numbers; the order is the front-end playlist order.') + '</p>' +
    (n ? '<div class="ahead" style="grid-template-columns:' + cols + '">' + head + '</div>' : '<div class="ahead" style="grid-template-columns:' + cols + '">' + head + '</div>') +
    (rows || '<div class="note">' + T('尚未加入音檔。','No audio yet.') + '</div>') +
    '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><button class="btn ghost" onclick="addAudios()">' + T('＋ 加入音檔','+ Add audio') + '</button><button class="btn ghost" onclick="openCopyPages()">' + T('複製頁碼…','Copy page numbers…') + '</button><button class="btn ghost" onclick="sortByLesson()">' + T('依書本課次排序','Sort by lesson') + '</button></div>' +
    '<div id="flashAudio" style="margin-top:12px"></div>';
}
function onAudioTitle(i, v){ if (curLoc === 'zh') draft.audios[i].titleZh = v; else draft.audios[i].titleEn = v; }
function onAudioLesson(i, v){ var n = parseInt(v, 10); draft.audios[i].lesson = isNaN(n) ? '' : n; }
function onAudioPage(i, k, v){
  var a = draft.audios[i]; a.pages = a.pages || {};
  var n = parseInt(v, 10);
  if (isNaN(n)) delete a.pages[k]; else a.pages[k] = n;
}
function moveAudio(i, d){
  var j = i + d; if (j < 0 || j >= draft.audios.length) return;
  var t = draft.audios[i]; draft.audios[i] = draft.audios[j]; draft.audios[j] = t; renderAudio();
}
function replaceAudio(i){
  var a = draft.audios[i];
  openPicker('audio', T('更換「' + (a.titleZh || a.titleEn || '此音檔') + '」引用的音頻素材','Replace the audio asset of "' + (a.titleZh || a.titleEn || 'this audio') + '"'), function(x){
    a.asset = x.n; renderAudio();
    var d = durInfo(x.n);
    flash('flashAudio', T('已更換引用','Reference replaced'), '<p style="margin:0">' + T('現在引用 ','Now references ') + '<code>' + escHtml(x.n) + '</code>，<b>' + T('時長已自動更新為 ','duration updated automatically to ') + d.text + '</b>——' + T('時長是素材的屬性，不是手填欄位。','duration is a property of the asset, not a field you type in.') + '</p>');
  }, false);
}
function removeAudio(i){ draft.audios.splice(i, 1); renderAudio(); }
function addAudios(){
  openPicker('audio', T('挑選音頻素材（可多選）','Pick audio assets (multi-select)'), function(list){
    list.forEach(function(x){
      draft.audios.push({id:'au' + Date.now() + Math.floor(Math.random() * 1000), titleZh:x.n, titleEn:'', lesson:'', asset:x.n, pages:{}});
    });
    renderAudio();
    flash('flashAudio', T('已加入 ' + list.length + ' 筆音檔','Added ' + list.length + ' audio item(s)'), '<ul><li>' + T('標題預設帶入素材檔名，請改寫為學員看得懂的標題。','Titles default to the asset file name; rewrite them into something students understand.') + '</li><li>' + T('書本課次與各版本頁碼留白，需逐筆補填——這些系統無從得知。','Lesson and per-version page numbers are left blank for you to fill in; the system cannot know them.') + '</li></ul>');
  }, true);
}
function sortByLesson(){
  var idx = {}; draft.audios.forEach(function(a, i){ idx[a.id || i] = i; });
  draft.audios.sort(function(a, b){
    var la = a.lesson === '' || a.lesson == null ? Infinity : a.lesson, lb = b.lesson === '' || b.lesson == null ? Infinity : b.lesson;
    return la === lb ? 0 : (la < lb ? -1 : 1);
  });
  renderAudio();
  flash('flashAudio', T('已依書本課次排序','Sorted by lesson'), '<p style="margin:0">' + T('沒填課次的排在最後；同一課次維持原本相對順序。','Items without a lesson go last; items in the same lesson keep their relative order.') + '</p>');
}
/* 複製頁碼 */
function openCopyPages(preTargets){
  var vks = sortedVersionKeys();
  if (vks.length < 2){
    openConfirm({kind:'notice', title:T('目前只有 ' + vks.length + ' 個版本','Only ' + vks.length + ' version(s) so far'), body:'<p style="margin:0;font-size:13.5px">' + T('複製頁碼需要至少兩個版本。請先在「檔案版本」加入版本。','Copying page numbers needs at least two versions. Add versions under File Versions first.') + '</p>'});
    return;
  }
  openConfirm({kind:'destructive', title:T('複製頁碼','Copy page numbers'), okText:T('複製','Copy'),
    body:'<div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:13.5px"><label for="cpSrc" style="margin:0">' + T('來源版本','Source version') + '</label><select id="cpSrc" style="max-width:220px" onchange="paintCopyTargets()">' +
      vks.map(function(k){ return '<option value="' + k + '">' + verLabelFull(k) + '</option>'; }).join('') + '</select></div>' +
      '<div style="display:flex;gap:10px;align-items:flex-start;font-size:13.5px"><span style="padding-top:2px">' + T('複製到','Copy to') + '</span><span id="cpTargets"></span></div><p class="hint" id="cpWarn" style="margin-top:10px"></p>',
    onOk:function(){
      var src = document.getElementById('cpSrc').value, ts = copyChosen(), n = 0;
      ts.forEach(function(t){ draft.audios.forEach(function(a){ a.pages = a.pages || {}; if (a.pages[src] != null){ a.pages[t] = a.pages[src]; n++; } else delete a.pages[t]; }); });
      renderAudio();
      flash('flashAudio', T('已複製 ' + n + ' 筆頁碼','Copied ' + n + ' page number(s)'), '<p style="margin:0">' + T('從 ','From ') + '<b>' + verLabelFull(src) + '</b>' + T(' 複製到 ' + ts.length + ' 個版本。兩邊自此各自獨立，不連動；來源日後改版，已複製的不會跟著變。',' to ' + ts.length + ' version(s). They are independent from now on; if the source is re-typeset later, copies do not follow.') + '</p>');
    }});
  window._cpPre = preTargets || [];
  paintCopyTargets();
}
function copyChosen(){ return [].map.call(document.querySelectorAll('#cpTargets input:checked'), function(el){ return el.value; }); }
function paintCopyTargets(){
  var vks = sortedVersionKeys(), src = document.getElementById('cpSrc').value;
  document.getElementById('cpTargets').innerHTML = vks.filter(function(k){ return k !== src; }).map(function(k){
    return '<label class="chkline2"><input type="checkbox" value="' + k + '"' + (window._cpPre.indexOf(k) > -1 ? ' checked' : '') + ' onchange="paintCopyWarn()"> ' + verLabelFull(k) + '</label>';
  }).join('');
  paintCopyWarn();
}
function paintCopyWarn(){
  var src = document.getElementById('cpSrc').value, ts = copyChosen(), over = 0, filled = 0;
  draft.audios.forEach(function(a){ if (a.pages && a.pages[src] != null) filled++; });
  ts.forEach(function(t){ draft.audios.forEach(function(a){ if (a.pages && a.pages[t] != null) over++; }); });
  document.getElementById('cpWarn').innerHTML = !ts.length ? T('請勾選至少一個目標版本。','Select at least one target version.')
    : T('來源有 ' + filled + ' 筆頁碼；目標版本已填的 ' + over + ' 筆將被覆蓋。','The source has ' + filled + ' page number(s); ' + over + ' already filled in the targets will be overwritten.');
  document.getElementById('uiOk').disabled = !ts.length;
}

/* ---- 4 使用中的產品（唯讀） ---- */
function renderUsed(){
  var used = isNew ? [] : usageOf(draft);
  var off = !isNew && (BOOKS.find(function(x){ return x.id === draft.id; }) || {}).status === '停用';
  var btn = isNew ? '' : '<button class="btn danger" onclick="toggleStatusInEditor()">' + T(off ? '啟用此教材' : '停用此教材', off ? 'Enable this material' : 'Disable this material') + '</button>';
  document.getElementById('secUsed').innerHTML =
    '<div class="sechead" style="justify-content:space-between"><h2>' + T('4　被引用情形與停用','4  References & Disabling') + '</h2>' + btn + '</div>' +
    '<p class="secwhy">' + T('教材可被多個產品引用，停用或大幅修改前請先看這裡的影響範圍。此區塊唯讀，要解除引用請到該產品的「使用教材」。','A material can be referenced by several products; check the impact here before disabling or heavily editing it. This block is read-only; to unlink, go to the product\'s Materials Used.') + '</p>' +
    (off && used.length ? '<div class="flashbox" style="margin-bottom:12px"><h4>' + T('這本教材已停用，下列產品需要處理','This material is disabled; the products below need attention') + '</h4><p style="margin:0">' + T('停用後這些產品的教材資源將無法取用，請逐一到產品把這本教材換掉或取消勾選。','After disabling, the material resources of these products can no longer be accessed. Go to each product and replace or uncheck this material.') + '</p></div>' : '') +
    (used.length ? used.map(function(p){
      return '<div class="usedrow"><span class="badge blue">' + escHtml(catName(p.categoryId)) + '</span><span class="nm">' + escHtml(p.name) + '</span><span class="small" style="color:var(--g500)">' + T('產品層','Product level') + '</span>' +
        '<a class="btn ghost sm" href="a02_products.html?edit=' + encodeURIComponent(p.id) + '">' + T('前往處理','Go to product') + '</a></div>';
    }).join('') : '<div class="note">' + T('目前沒有產品引用這筆教材。','No product references this material yet.') + '</div>') +
    '<div class="hint" style="margin-top:8px">' + T('停用規則：警示後允許。被引用時停用不會被阻擋，停用前會列出受影響的產品，由你判斷；停用後教材與資料完整保留，仍可查詢與編輯。','Disable rule: warn, then allow. Disabling a referenced material is not blocked; the affected products are listed before you confirm and the call is yours. After disabling, the material and its data are kept in full and stay viewable and editable.') + '</div>';
}

/* ---- 儲存 ---- */
function saveBook(){
  draft.titleZh = (draft.titleZh || '').trim(); draft.titleEn = (draft.titleEn || '').trim();
  if (!draft.titleZh){ curLoc = 'zh'; renderBasic(); toast(T('請填寫繁體中文標題','Please fill in the Traditional Chinese title')); return; }
  var emptyTitle = (draft.audios || []).some(function(a){ return !(a.titleZh || '').trim(); });
  if (emptyTitle){ curLoc = 'zh'; renderBasic(); renderAudio(); toast(T('有音檔沒有繁體中文標題','Some audio items have no Traditional Chinese title')); return; }
  var orig = isNew ? null : BOOKS.find(function(x){ return x.id === draft.id; });
  var doSave = function(){
    if (orig){ Object.keys(orig).forEach(function(k){ delete orig[k]; }); Object.assign(orig, JSON.parse(JSON.stringify(draft))); }
    else {
      var mx = 0; BOOKS.forEach(function(b){ var m = /^bk(\d+)$/.exec(b.id); if (m) mx = Math.max(mx, Number(m[1])); });
      draft.id = 'bk' + (mx + 1); BOOKS.push(JSON.parse(JSON.stringify(draft)));
      isNew = false; qId = draft.id;
      try{ history.replaceState(null, '', 'a25_materials.html?id=' + draft.id); }catch(e){}
    }
    TLI_MASTERS.saveMaterialBooks();
    snapshot = JSON.stringify(draft);
    renderEditor();
    toast(T('已儲存教材「' + bookTitle(draft) + '」','Material "' + bookTitle(draft) + '" saved'));
  };
  if (orig && orig.status === '啟用' && draft.status === '停用' && usageOf(orig).length) confirmDisable(orig, doSave); else doSave();
}

/* ================= 素材挑選對話框（素材類型鎖定；教材素材單選、音頻素材多選） ================= */
var pick = {kind:'pdf', multi:false, sel:[], cb:null};
function openPicker(kind, title, cb, multi){
  pick = {kind:kind, multi:!!multi, sel:[], cb:cb};
  document.getElementById('pkTitle').textContent = title;
  document.getElementById('pkType').textContent = kind === 'pdf' ? T('教材素材','Material asset') : T('音頻素材','Audio asset');
  document.getElementById('pkSearch').value = '';
  document.getElementById('pkFoot').style.display = pick.multi ? 'flex' : 'none';
  document.getElementById('pkLibPane').style.display = '';
  document.getElementById('pkNewPane').style.display = 'none';
  document.getElementById('pkTabLib').className = 'on'; document.getElementById('pkTabNew').className = '';
  document.getElementById('pkUrl').value = ''; document.getElementById('pkName').value = '';
  document.getElementById('pkTags').innerHTML = ASSET_TAGS.map(function(t){ return '<label class="chkline2"><input type="checkbox" value="' + escAttr(t) + '" onchange="pkNewValid()"> ' + escHtml(t) + '</label>'; }).join('');
  /* 內容標籤複選篩選（4.9 §二：符合任一個；未選不套用）與格式說明（集中於 TLI_MASTERS.resourceLibraries[].formats，口頭決定、待確認） */
  document.getElementById('pkTagF').innerHTML = ASSET_TAGS.map(function(t){ return '<label class="chkline2"><input type="checkbox" value="' + escAttr(t) + '" onchange="pkRender()"> ' + escHtml(t) + '</label>'; }).join('');
  var fl = (TLI_MASTERS.resourceLibraries || []).filter(function(x){ return x.key === (kind === 'pdf' ? 'materials' : 'audio'); })[0];
  var fm = fl && fl.formats ? fl.formats.split(',') : [];
  document.getElementById('pkFmt').textContent = fm.length ? T('僅限 ' + fm.join('、') + ' 格式', 'Formats: ' + fm.join(', ') + ' only') : '';
  pkNewValid(); pkRender(); pkCount();
  document.getElementById('pkMask').classList.add('open');
}
function closePicker(){ document.getElementById('pkMask').classList.remove('open'); }
function pkTab(w){
  document.getElementById('pkLibPane').style.display = w === 'lib' ? '' : 'none';
  document.getElementById('pkNewPane').style.display = w === 'new' ? '' : 'none';
  document.getElementById('pkTabLib').className = w === 'lib' ? 'on' : '';
  document.getElementById('pkTabNew').className = w === 'new' ? 'on' : '';
}
function pkSrc(){ return pick.kind === 'pdf' ? LIB_PDF : LIB_AUDIO; }
function pkRender(){
  var q = document.getElementById('pkSearch').value.trim().toLowerCase(), g = document.getElementById('pkGrid');
  var tf = Array.prototype.map.call(document.querySelectorAll('#pkTagF input:checked'), function(i){ return i.value; });
  var items = pkSrc().filter(function(a){ return !q || a.n.toLowerCase().indexOf(q) > -1; })
    .filter(function(a){ return !tf.length || (a.tags || []).some(function(t){ return tf.indexOf(t) > -1; }); });
  g.innerHTML = items.map(function(a){
    var idx = pkSrc().indexOf(a), on = pick.sel.indexOf(idx) > -1;
    var sub = pick.kind === 'pdf' ? T('教材素材','Material asset') : durInfo(a.n).text;
    return '<button type="button" class="pcard' + (on ? ' sel' : '') + '" onclick="pkClick(' + idx + ')"><span class="ph">' + (pick.kind === 'pdf' ? 'PDF' : T('音檔','Audio')) + '</span><span class="cn">' + escHtml(a.n) + '</span><span class="ct">' + sub + '</span></button>';
  }).join('') || '<p class="hint">' + T('資源庫中沒有符合的素材。請先到「新增」分頁新增。','No matching assets in the library. Add one in the New tab.') + '</p>';
}
function pkCount(){ document.getElementById('pkCount').textContent = T('已選 ' + pick.sel.length + ' 筆','' + pick.sel.length + ' selected'); }
function pkClick(idx){
  if (!pick.multi){ var a = pkSrc()[idx]; closePicker(); if (pick.cb) pick.cb(a); return; }
  var i = pick.sel.indexOf(idx);
  if (i > -1) pick.sel.splice(i, 1); else pick.sel.push(idx);
  pkRender(); pkCount();
}
function pkAddSelected(){
  if (!pick.sel.length) return;
  var list = pick.sel.map(function(i){ return pkSrc()[i]; });
  closePicker(); if (pick.cb) pick.cb(list);
}
function pkNewValid(){
  var ok = document.querySelectorAll('#pkTags input:checked').length > 0;
  document.getElementById('pkInsert').disabled = !ok;
  document.getElementById('pkWhy').textContent = ok ? '' : T('尚未選擇內容標籤','No content tag selected yet');
}
function pkUrlInput(){
  var v = document.getElementById('pkUrl').value.trim();
  if (v && !document.getElementById('pkName').value.trim()) document.getElementById('pkName').value = /^<iframe/i.test(v) ? T('嵌入內容（iframe）','Embedded content (iframe)') : (v.split('/').pop() || v);
}
function pkInsert(){
  var name = document.getElementById('pkName').value.trim() || T('新素材','New asset') + '_' + Date.now();
  var tags = Array.prototype.map.call(document.querySelectorAll('#pkTags input:checked'), function(i){ return i.value; });
  var a = pick.kind === 'pdf' ? {n:name, tags:tags} : {n:name, d:'parsing', tags:tags};
  pkSrc().push(a);
  closePicker();
  if (pick.cb) pick.cb(pick.multi ? [a] : a);
}

/* ================= 進入點 ================= */
function renderPage(){
  if (draft) renderEditor(); else renderList();
}
if (qId || qNew){
  if (!openEditor()) { draft = null; }
}
renderPage();
if (window.TLI_I18N){ TLI_I18N.onRefresh(renderPage); TLI_I18N.onRefresh(renderNotifPanel); TLI_I18N.init(); }

/* 對話框的靜態文字（繁中預設，英文走 TLI_I18N.t）；語系切換時一併更新 */
function applyPickerLabels(){
  var set = function(id, zh, en){ var el = document.getElementById(id); if (el) el.textContent = T(zh, en); };
  set('pkTypeLbl','素材類型','Asset type'); set('pkLockHint','類型已鎖定，此處不提供切換','Type is locked; no switching here');
  set('pkTabLib','資源庫','Library'); set('pkTabNew','新增','New'); set('pkAddBtn','加入所選','Add selected');
  set('pkDrop','選擇新的素材檔案','Choose a new asset file'); set('pkUrlLbl','或　輸入網址／嵌入碼','or enter a URL / embed code');
  set('pkNameLbl','素材名稱','Asset name'); set('pkNameHint','預設帶入檔名，可改為更好辨識的名稱；不強制，日後可在資源庫修改。','Defaults to the file name; rename it for clarity if you like. Not required, and editable later in the Resource Library.');
  set('pkTagLbl','內容標籤','Content tags'); set('pkTagHint','至少選一個。素材數量一多，標籤是唯一有效的篩選方式。','Pick at least one. Once assets pile up, tags are the only effective way to filter.');
  set('pkInsert','新增並插入','Add and insert'); set('uiCancel','取消','Cancel');
  document.getElementById('pkSearch').placeholder = T('搜尋名稱','Search name');
  set('pkTagFLbl','內容標籤','Content tags'); set('pkTagFHint','複選時符合任一標籤即可','Matches any selected tag');
}
applyPickerLabels();
if (window.TLI_I18N) TLI_I18N.onRefresh(applyPickerLabels);

</script>
<script>
function toggleNavGroup(ev, gid){
  ev.stopPropagation();
  var g = document.querySelector('#sidebar .navgroup[data-group="'+gid+'"]');
  if (!g) return;
  var collapsed = g.classList.toggle('collapsed');
  try{ localStorage.setItem('tliNavCollapse_'+gid, collapsed ? '1' : '0'); }catch(e){}
}
(function initNavGroups(){
  var activeLink = document.querySelector('#sidebar a.active');
  var activeGroup = activeLink ? activeLink.closest('.navgroup') : null;
  /* 20260927f：預設只展開目前頁面所在的群，其他群收合；若使用者手動展開/收合過某群，之後照該紀錄 */
  document.querySelectorAll('#sidebar .navgroup[data-group]').forEach(function(g){
    var gid = g.dataset.group, saved = null;
    try{ saved = localStorage.getItem('tliNavCollapse_'+gid); }catch(e){}
    if (saved === '1') g.classList.add('collapsed');
    else if (saved === '0') g.classList.remove('collapsed');
    else if (g !== activeGroup) g.classList.add('collapsed');
  });
  /* 目前頁所屬群組不可被收合到看不到 active 項目 */
  if (activeGroup) activeGroup.classList.remove('collapsed');
})();

/* ================= ESC 鍵關閉目前開啟中的 modal ================= */
document.addEventListener('keydown', function(e){
  if (e.key !== 'Escape') return;
  ['importModal','newProductModal','newCategoryModal'].forEach(function(id){
    var el = document.getElementById(id);
    if (el && el.classList.contains('open')) el.classList.remove('open');
  });
});
</script>
<script>
/* 20260929 死按鈕修正：側欄使用者選單（姓名／大頭貼）點擊開合；此頁樣板漏帶 toggleSuMenu */
window.toggleSuMenu = window.toggleSuMenu || function(ev){
  if (ev) ev.stopPropagation();
  var m = document.getElementById('suMenu'); if (!m) return;
  ['notifPanel','avatarMenu'].forEach(function(id){ var e = document.getElementById(id); if (e) e.classList.remove('open'); });
  m.classList.toggle('open');
};
document.addEventListener('click', function(ev){
  var m = document.getElementById('suMenu');
  if (m && !m.contains(ev.target)) m.classList.remove('open');
});
</script>
