<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>重設密碼｜TLI Hub 管理後台</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  用一次性密碼登入後的單獨重設密碼頁（2026-11-05）。流程：a00_admin_login.html 忘記密碼 → 一次性密碼 → 本頁 → 設好新密碼 → 回後台 a02_products.html。
  - 這是用一次性密碼登入的人才進得來；不需原密碼（個人設定 a00_profile.html 的變更密碼才需要原密碼）。
  - 沒有「返回後台」或略過：沒設好新密碼不能進後台。沒有一次性密碼登入的記錄（sessionStorage tliAdminSession_v1.otp）直接開本頁會被導回登入頁。
  - 密碼規則（2026-11-10 使用者指定）：至少 8 碼，大寫英文、小寫英文、數字、符號（只算半形符號）各至少 1 個；新密碼不可與舊密碼相同。
    本頁沒有原密碼欄位，「不可與舊密碼相同」由系統比對已存的舊密碼；原型沒有存密碼，無法示範這項檢查，只檢查必填、規則、兩次一致。
-->
<style>
:root{--navy:#1B4E8C;--navy-dark:#123a68;--g50:#F5F7FA;--g200:#E4E7EC;--g500:#667085;--g900:#101828;--red:#C0392B;}
*{box-sizing:border-box;}
[hidden]{display:none!important;}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,-apple-system,sans-serif;background:var(--g50);color:var(--g900);padding:24px 16px;}
.box{width:100%;max-width:400px;background:#fff;border:1px solid var(--g200);border-radius:12px;box-shadow:0 1px 3px rgba(16,24,40,.06);padding:28px 28px 24px;}
.brand{display:flex;flex-direction:column;gap:6px;padding-bottom:16px;margin-bottom:18px;border-bottom:1px solid var(--g200);}
.brand img{height:28px;width:auto;display:block;align-self:flex-start;}
.brand small{font-size:12px;color:var(--g500);text-transform:uppercase;letter-spacing:.04em;}
h1{font-size:20px;margin:0 0 6px;}
.desc{font-size:12.5px;color:var(--g500);line-height:1.6;margin:0 0 18px;}
label{display:block;font-size:12.5px;font-weight:600;margin:0 0 6px;}
.field{margin-bottom:14px;}
.hint{font-size:12px;color:var(--g500);line-height:1.6;margin-top:5px;}
input[type=password]{width:100%;padding:9px 11px;border:1px solid var(--g200);border-radius:6px;font-size:14px;font-family:inherit;color:var(--g900);background:#fff;}
input:focus{outline:2px solid #BFD3EC;border-color:var(--navy);}
.btn{display:block;width:100%;background:var(--navy);color:#fff;border:none;padding:10px 14px;border-radius:6px;font-size:14px;cursor:pointer;font-family:inherit;}
.btn:hover{background:var(--navy-dark);}
.err{background:#FDECEC;border:1px solid #F0B7B7;color:var(--red);border-radius:6px;padding:8px 10px;font-size:12.5px;margin-bottom:14px;}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--g900);color:#fff;border-radius:8px;padding:10px 18px;font-size:13px;z-index:100;}
</style>
</head>
<body>
<main class="box">
  <div class="brand">
    <img src="../assets/tli-logo.svg" alt="TLI">
    <small data-i18n="a00.brand">TLI Hub 管理後台</small>
  </div>
  <h1 data-i18n="a00r.title">重設密碼</h1>
  <p class="desc" data-i18n="a00r.desc">你使用一次性密碼登入，請先設定新密碼，完成後進入管理後台。</p>
  <form id="f" novalidate>
    <div class="err" id="err" hidden></div>
    <div class="field">
      <label for="pw1" data-i18n="a00p.newPw">新密碼</label>
      <input type="password" id="pw1" autocomplete="new-password">
      <div class="hint" data-i18n="a00p.pwRule">至少 8 碼，需含大寫英文、小寫英文、數字、符號各至少 1 個</div>
    </div>
    <div class="field">
      <label for="pw2" data-i18n="a00r.confirm">確認密碼</label>
      <input type="password" id="pw2" autocomplete="new-password">
    </div>
    <button type="submit" class="btn" data-i18n="a00r.submit">確定</button>
  </form>
</main>

<script src="../assets/_shared_masters.js"></script>
<script src="../assets/_i18n_dict.js"></script>
<script>
Object.assign(TLI_I18N_DICT.en, {
"a00.brand":"TLI Hub Admin",
"a00r.title":"Reset Password",
"a00r.desc":"You signed in with a one-time password. Please set a new password first, then you will enter the admin.",
"a00p.newPw":"New password",
"a00p.pwRule":"At least 8 characters, with at least one uppercase letter, one lowercase letter, one number and one symbol",
"a00r.confirm":"Confirm password",
"a00r.submit":"Confirm"
});
</script>
<script src="../assets/_i18n.js"></script>
<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var t = function(zh,en){ return window.TLI_I18N ? TLI_I18N.t(zh,en) : zh; };

  /* 不是用一次性密碼登入的，導回登入頁 */
  var ok = false;
  try{ var ss = JSON.parse(sessionStorage.getItem('tliAdminSession_v1')); ok = !!(ss && ss.otp); }catch(e){}
  if(!ok){ location.replace('a00_admin_login.html'); return; }

  var PW_RE = /^(?=.*[A-Z])(?=.*[a-z])(?=.*\d)(?=.*[!-\/:-@\[-`{-~]).{8,}$/; /* 密碼規則（2026-11-10 使用者指定）：至少 8 碼，大寫英文、小寫英文、數字、符號各至少 1 個 */
  function showErr(msg){ $('err').textContent = msg || ''; $('err').hidden = !msg; }
  $('f').onsubmit = function(e){
    e.preventDefault();
    var p1 = $('pw1').value, p2 = $('pw2').value;
    if(!p1){ showErr(t('請輸入新密碼','Please enter a new password')); return; }
    if(!PW_RE.test(p1)){ showErr(t('密碼需至少 8 碼，且大寫英文、小寫英文、數字、符號各至少 1 個。','Use at least 8 characters with at least one uppercase letter, one lowercase letter, one number and one symbol.')); return; }
    if(p1 !== p2){ showErr(t('兩次輸入的新密碼不一致','The two new passwords do not match')); return; }
    showErr('');
    try{ var ss = JSON.parse(sessionStorage.getItem('tliAdminSession_v1')) || {}; delete ss.otp; sessionStorage.setItem('tliAdminSession_v1', JSON.stringify(ss)); }catch(x){}
    var el = document.createElement('div'); el.className = 'toast'; el.textContent = t('密碼已更新','Password updated');
    document.body.appendChild(el);
    setTimeout(function(){ location.href = 'a02_products.html'; }, 900);
  };

  if(window.TLI_I18N) TLI_I18N.init();
})();
</script>
</body>
</html>
